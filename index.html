    let c;
    if (y < 0) c = y < -8 ? MAPC.deep : MAPC.shallow;
    else if (y < 3 && _W[CITY] < 0.5) c = MAPC.sand;
    else if (b === CITY) c = MAPC.city;
    else if (b === MOUNTAIN || y > 120) c = y > 225 ? MAPC.snow : MAPC.mount;
    else if (b === FOREST) c = MAPC.forest;
    else if (b === FIELDS) c = MAPC.fields;
    else c = MAPC.grass;
    const shade = b === MOUNTAIN ? 0.8 + clamp(y / 400, 0, 0.35) : 1, k = (j * MAPN + i) * 4;
    D[k] = c[0] * shade; D[k + 1] = c[1] * shade; D[k + 2] = c[2] * shade; D[k + 3] = 255;
  }
  mapOffCtx.putImageData(mapImg, 0, 0);
  const cv = $('map'), dpr = Math.min(devicePixelRatio || 1, 2), S = cv.clientWidth;
  if (!S) return;
  if (cv.width !== Math.round(S * dpr)) { cv.width = cv.height = Math.round(S * dpr); }
  const g = mapCtx, sc = S / (MAPN * MAPS), max = S / 2 - 12;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, S, S);
  g.imageSmoothingEnabled = true; g.drawImage(mapOff, 0, 0, S, S);
  const toMap = (x, z, clampEdge) => {
    const dx = x - p.x, dz = z - p.z;
    let u = (dx * rx + dz * rz) * sc, v = (dx * fx + dz * fz) * sc;
    const L = Math.hypot(u, v);
    if (L > max) { if (!clampEdge) return null; u *= max / L; v *= max / L; }
    return [S / 2 + u, S / 2 - v];
  };
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const b of basesNear(p.x, p.z, 2)) {
    const q = toMap(b.x, b.z, false);
    if (!q) continue;
    g.fillStyle = COL.white; g.beginPath(); g.arc(q[0], q[1], 7, 0, TAU); g.fill();
    g.fillStyle = COL.leaf; g.fillRect(q[0] - 1.6, q[1] - 5, 3.2, 10); g.fillRect(q[0] - 5, q[1] - 1.6, 10, 3.2);
  }
  const o = objective();
  if (o) {
    const q = toMap(o.x, o.z, true);
    g.fillStyle = COL.white; g.beginPath(); g.arc(q[0], q[1], 11, 0, TAU); g.fill();
    g.font = `15px ${EMOJI_FONT}`;
    g.fillText(game.phase === 'go' ? '🆘' : game.phase === 'refuel' ? '⛽' : '🏥', q[0], q[1] + 1);
  }
  g.save(); g.translate(S / 2, S / 2);
  g.fillStyle = COL.berry; g.strokeStyle = COL.white; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(0, -10); g.lineTo(7, 7); g.lineTo(0, 3); g.lineTo(-7, 7); g.closePath(); g.stroke(); g.fill();
  g.restore();
}

/* =====================================================================
   Input, dock, trays
   ===================================================================== */
const isFormEl = (el) => el && (el.tagName === 'SELECT' || el.tagName === 'INPUT');
addEventListener('keydown', (e) => {
  if (isFormEl(e.target)) return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  if (!e.repeat && e.code === 'KeyC') cycleCam();
  if (!e.repeat && e.code === 'KeyH') toggleHud();
  if (!e.repeat && e.code === 'KeyR') toggleRobot();
  if (e.code === 'Escape') closeTrays();
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
for (const b of document.querySelectorAll('[data-key]')) {
  const code = b.dataset.key;
  const on = (e) => { e.preventDefault(); keys.add(code); b.classList.add('held'); try { b.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ } };
  const off = () => { keys.delete(code); b.classList.remove('held'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
}
let drag = null;
canvas.addEventListener('pointerdown', (e) => { closeTrays(); drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging'); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  cam.orbitYaw -= (e.clientX - drag.x) * 0.006; cam.orbitPitch += (e.clientY - drag.y) * 0.004;
  drag.x = e.clientX; drag.y = e.clientY; cam.lastDrag = simTime;
});
const endDrag = () => { drag = null; canvas.classList.remove('dragging'); };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.zoom = clamp(cam.zoom * Math.exp(e.deltaY * 0.001), 0.45, 3); }, { passive: false });

function cycleCam() { cam.mode = (cam.mode + 1) % CAM_MODES.length; cam.fly = null; cam.subT = 0; $('camName').textContent = CAM_NAMES[cam.mode]; }
function toggleHud() { const off = document.body.classList.toggle('hud-off'); $('showHud').hidden = !off; closeTrays(); }
function toggleRobot() {
  game.robot = !game.robot;
  $('botLbl').textContent = game.robot ? 'Robot on' : 'Robot off';
  $('btnBot').classList.toggle('off', !game.robot);
  if (game.robot) toast('🤖', 'Robot pilot is flying', 'Press the arrows any time to take over');
  else toast('🕹️', "You're the pilot!", 'Steer with the arrows, go up and down too');
}
$('btnBot').addEventListener('click', toggleRobot);
$('btnCam').addEventListener('click', cycleCam);
$('btnHud').addEventListener('click', toggleHud);
$('showHud').addEventListener('click', toggleHud);
$('btnSnd').addEventListener('click', () => {
  if (!audio.ctx) { try { audio.start(); } catch (err) { $('icSnd').textContent = '🚫'; return; } }
  const on = !$('btnSnd').classList.contains('on');
  if (on) audio.ctx.resume(); else audio.ctx.suspend();
  $('btnSnd').classList.toggle('on', on);
  $('icSnd').textContent = on ? '🔊' : '🔇';
});

const trayWx = $('trayWx'), trayTime = $('trayTime');
function trayButton(ic, label, onClick) {
  const b = document.createElement('button'); b.type = 'button';
  const i = document.createElement('span'); i.className = 'ic'; i.textContent = ic;
  b.append(i, label); b.addEventListener('click', onClick);
  return b;
}
function trayTitle(t) { const d = document.createElement('div'); d.className = 'tray-title'; d.textContent = t; return d; }
trayWx.append(trayTitle('Pick the weather'));
const wxBtns = {};
for (const k of ['auto', ...Object.keys(WX)]) {
  const [ic, label] = k === 'auto' ? ['🎲', 'Surprise me'] : WX_KID[k];
  wxBtns[k] = trayButton(ic, label, () => { wx.mode = k; if (k === 'auto') wx.timer = 45; closeTrays(); });
  trayWx.append(wxBtns[k]);
}
trayTime.append(trayTitle('Pick the time'));
for (const [ic, label, h] of [['🌅', 'Sunrise', 6.3], ['☀️', 'Daytime', 12], ['🌇', 'Sunset', 17.7], ['🌙', 'Night', 22.5]]) {
  trayTime.append(trayButton(ic, label, () => { tod.h = h; closeTrays(); }));
}
const brk = document.createElement('div'); brk.className = 'row-break'; trayTime.append(brk);
const rateBtns = [];
for (const [ic, label, r] of [['⏸️', 'Stop clock', 0], ['▶️', 'Normal', 1], ['⏩', 'Fast', 6]]) {
  const b = trayButton(ic, label, () => { tod.rate = r; syncTrays(); });
  b.dataset.r = r; rateBtns.push(b); trayTime.append(b);
}
function syncTrays() {
  for (const k in wxBtns) wxBtns[k].classList.toggle('on', wx.mode === k);
  for (const b of rateBtns) b.classList.toggle('on', +b.dataset.r === tod.rate);
}
function openTray(which) {
  const showWx = which === 'wx' && trayWx.hidden, showT = which === 'time' && trayTime.hidden;
  trayWx.hidden = !showWx; trayTime.hidden = !showT;
  $('btnWx').classList.toggle('open', showWx); $('btnTime').classList.toggle('open', showT);
  syncTrays();
}
function closeTrays() { trayWx.hidden = trayTime.hidden = true; $('btnWx').classList.remove('open'); $('btnTime').classList.remove('open'); }
$('btnWx').addEventListener('click', () => openTray('wx'));
$('btnTime').addEventListener('click', () => openTray('time'));
new ResizeObserver(() => document.documentElement.style.setProperty('--dock-h', $('dock').offsetHeight + 'px')).observe($('dock'));

function resize() {
  const w = innerWidth, h = innerHeight;
  if (!w || !h) return;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio); renderer.setSize(w, h);
  composer.setPixelRatio(pixelRatio); composer.setSize(w, h);
  bloom.resolution.set(w / 2, h / 2);
  snow.mat.uniforms.uScale.value = (h * pixelRatio) / (2 * Math.tan((camera.fov * Math.PI) / 360));
}
addEventListener('resize', resize);

/* =====================================================================
   Main loop
   ===================================================================== */
let simTime = 0, last = performance.now(), hudT = 0, mapT = 0, perfAcc = 0, perfN = 0;
const seen = { wx: wx.key, night: false, phase: game.phase, saved: 0 };
function frame(now) {
  // The first rAF timestamp can predate the performance.now() taken at boot, so clamp at zero.
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (dt > 0) tick(dt);
  requestAnimationFrame(frame);
}
function tick(dt) {
  simTime += dt;
  updateWeather(dt);
  updatePilot(dt);
  updateHeli(dt);
  updateGame(dt);
  world.update(5);
  updateCamera(dt);
  updateEnvironment(dt);
  world.updateDynamic(dt, simTime, env.night);
  birds.update(dt, simTime);
  smoke.update(dt, env.light);
  audio.update();
  if (wx.key !== seen.wx) { seen.wx = wx.key; toast(WX_KID[wx.key][0], WX_SAY[wx.key], '', true); }
  const isNight = env.night > 0.6;
  if (isNight !== seen.night && (isNight || env.night < 0.3)) {
    seen.night = isNight;
    if (isNight) toast('🌙', 'Good night!', 'The searchlight is on', true);
    else toast('🌅', 'Good morning!', 'The sun is up', true);
  }
  if (game.phase !== seen.phase) {
    if (game.phase === 'deliver') audio.chime([659, 784]);
    if (game.saved !== seen.saved) audio.chime();
    seen.phase = game.phase; seen.saved = game.saved;
  }
  hudT -= dt; mapT -= dt;
  if (!document.body.classList.contains('hud-off')) {
    if (hudT <= 0) { hudT = 0.1; updateHud(); }
    if (mapT <= 0) { mapT = 0.35; drawMap(); }
  }
  if (innerWidth > 0 && innerHeight > 0) composer.render(dt);
  perfAcc += dt; perfN++;
  if (perfAcc > 3) {
    const avg = perfAcc / perfN;
    // Skip the boot and tow-back windows, where streaming in chunks causes one-off hitches.
    if (simTime > 8 && game.phase !== 'fade') {
      if (avg > 0.036 && pixelRatio > 0.75) { pixelRatio = Math.max(0.75, pixelRatio - 0.25); resize(); }
      else if (avg < 0.02 && pixelRatio < MAX_PR) { pixelRatio = Math.min(MAX_PR, pixelRatio + 0.25); resize(); }
    }
    perfAcc = 0; perfN = 0;
  }
}

// Console handle for tinkering: heliSim.tod.h = 22; heliSim.wx.mode = 'storm'; heliSim.game.fuel = 10
window.heliSim = { tod, wx, cam, pilot, world, game, seed: SEED, step: (n = 1, dt = 1 / 30) => { for (let i = 0; i < n; i++) tick(dt); } };

async function boot() {
  TURB_YAW = Math.random() * TAU;
  initPilot();
  cam.yawS = pilot.heading;
  let remaining = 1, total = 0;
  while (remaining > 0) {
    remaining = world.update(40);
    total = Math.max(total, remaining + world.chunks.size);
    $('ldBar').style.width = Math.round(100 * (1 - remaining / Math.max(total, 1))) + '%';
    $('ldText').textContent = `Building the world · ${world.chunks.size} pieces`;
    await new Promise((r) => setTimeout(r, 0));
  }
  birds.reset();
  updateHeli(0); updateCamera(0.016); updateEnvironment(0.016);
  resize();
  $('ldBar').style.width = '100%';
  $('ldText').textContent = 'Warming up the engines…';
  await new Promise((r) => setTimeout(r, 0));
  renderer.compile(scene, camera);
  updateHud(); drawMap();
  $('loading').classList.add('done');
  toast('🚁', 'Welcome, rescue pilot!', 'People need your help today');
  last = performance.now();
  requestAnimationFrame(frame);
}
boot().catch((err) => {
  console.error(err);
  const el = $('err'); el.hidden = false; el.textContent = 'Something went wrong starting the game: ' + err.message;
});
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// three.js) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
</script>
