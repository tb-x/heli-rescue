<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heli Rescue</title>
<meta name="theme-color" content="#8cc8f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Heli Rescue">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed 3D view. Mission card top-left, map + fuel + score top-right, steering pads in the bottom
   corners, a chunky toy-style dock bottom-centre with pop-up trays. One bright, playful look made for kids. */
:root {
  --bg: #8cc8f0;
  --bg-top: #7cc4f4;
  --bg-bottom: #c4e6fb;
  --ink: #1f2a44;
  --ink-soft: #5b6885;
  --paper: rgba(255, 255, 255, 0.94);
  --chip: #eef3fa;
  --chip-on: #fff3d1;
  --shadow: rgba(31, 42, 68, 0.24);
  --sky: #2f9cf0;
  --sun: #ffb21f;
  --leaf: #2fb35a;
  --berry: #ff4f84;
  --grape: #8a63ff;
  --slate: #8d99b3;
  --white: #ffffff;
  --font: 'Fredoka', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --gap: 16px;
  --dock-h: 84px;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-tap-highlight-color: transparent; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#view.dragging { cursor: grabbing; }
button { font-family: var(--font); -webkit-user-select: none; user-select: none; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

.bubble { position: fixed; background: var(--paper); border-radius: 22px; box-shadow: 0 5px 0 var(--shadow); }
.mission { top: calc(var(--gap) + env(safe-area-inset-top, 0px)); left: calc(var(--gap) + 54px + env(safe-area-inset-left, 0px)); padding: 12px 18px 14px 14px; display: grid; gap: 8px; max-width: min(400px, calc(100vw - 2 * var(--gap) - 204px)); box-sizing: border-box; }
.m-head { display: flex; align-items: center; gap: 12px; }
.m-ic { font-size: 46px; line-height: 1; }
.m-title { font-size: 25px; font-weight: 700; line-height: 1.08; text-wrap: balance; }
.m-do { font-size: 16px; font-weight: 500; color: var(--ink-soft); margin-top: 3px; text-wrap: balance; }
.m-do b { color: var(--berry); font-weight: 600; }
.m-people { display: flex; flex-wrap: wrap; gap: 4px; font-size: 24px; line-height: 1; }
.m-people span.off { opacity: 0.22; filter: grayscale(1); }
.m-bar { height: 14px; border-radius: 7px; background: var(--chip); overflow: hidden; }
.m-bar i { display: block; height: 100%; width: 0; background: var(--leaf); border-radius: 7px; transition: width 0.2s; }

.side { position: fixed; top: calc(var(--gap) + env(safe-area-inset-top, 0px)); right: var(--gap); display: grid; justify-items: end; gap: 10px; }
.side .bubble { position: static; }
.mapbox { width: 168px; height: 168px; border-radius: 50%; overflow: hidden; border: 5px solid var(--white); box-shadow: 0 5px 0 var(--shadow); background: var(--bg); }
#map { width: 100%; height: 100%; display: block; }
.pill { padding: 7px 14px; font-size: 17px; font-weight: 600; white-space: nowrap; border-radius: 18px; }
.fuel { display: flex; align-items: center; gap: 8px; font-size: 22px; padding: 7px 12px; }
.fuel-bar { width: 118px; height: 18px; border-radius: 9px; background: var(--chip); overflow: hidden; box-shadow: inset 0 0 0 2px rgba(31, 42, 68, 0.1); }
.fuel-bar i { display: block; height: 100%; width: 100%; background: var(--leaf); border-radius: 9px; transition: width 0.3s, background-color 0.3s; }
.fuel.mid .fuel-bar i { background: var(--sun); }
.fuel.low .fuel-bar i { background: var(--berry); }
.fuel.low { animation: blink 0.9s steps(2, jump-none) infinite; }
@keyframes blink { 50% { transform: scale(1.08); } }
.cap { font-size: 15px; color: var(--ink-soft); }

.pad { position: fixed; bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; }
.pad.left { left: var(--gap); }
.pad.right { right: var(--gap); flex-direction: column; }
.pad button { width: 78px; height: 78px; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink); box-shadow: 0 6px 0 var(--shadow); display: grid; place-items: center; align-content: center; cursor: pointer; touch-action: none; transition: transform 0.08s, box-shadow 0.08s; }
.pad.right button { height: 64px; }
.pad button span { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-top: -3px; }
.pad svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.pad.right svg { width: 30px; height: 30px; }
.pad button.held { transform: translateY(5px); box-shadow: 0 1px 0 var(--shadow); background: var(--chip-on); }

.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px)); display: flex; gap: 9px; padding: 9px; background: var(--paper); border-radius: 28px; box-shadow: 0 5px 0 var(--shadow); }
.dock button { --c: var(--sky); display: grid; justify-items: center; gap: 3px; min-width: 76px; padding: 9px 8px 8px; border: 0; border-radius: 20px; background: var(--c); color: var(--white); font-size: 14px; font-weight: 600; line-height: 1; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2); cursor: pointer; transition: transform 0.08s, box-shadow 0.08s; }
.dock button.dark-text { color: var(--ink); }
.dock button:active, .dock button.open { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2); }
#btnBot { --c: var(--berry); }
#btnBot.off { --c: var(--slate); }
.dock .ic { font-size: 29px; line-height: 1.05; }
.dock button.small { min-width: 60px; }

.tray { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--gap) + var(--dock-h) + 14px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-radius: 26px; box-shadow: 0 5px 0 var(--shadow); padding: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: max-content; max-width: calc(100vw - 2 * var(--gap)); box-sizing: border-box; }
.tray-title { flex-basis: 100%; text-align: center; font-weight: 600; color: var(--ink-soft); font-size: 16px; }
.row-break { flex-basis: 100%; height: 0; }
.tray button { width: 86px; padding: 9px 4px 8px; border: 3px solid transparent; border-radius: 18px; background: var(--chip); color: var(--ink); display: grid; justify-items: center; gap: 4px; font-size: 13.5px; font-weight: 600; line-height: 1.1; cursor: pointer; }
.tray button .ic { font-size: 32px; line-height: 1; }
.tray button.on { border-color: var(--sky); background: var(--chip-on); }
.tray button:active { transform: scale(0.94); }

.toast { position: fixed; left: 50%; top: calc(var(--gap) + 6px + env(safe-area-inset-top, 0px)); transform: translateX(-50%) scale(0.5); opacity: 0; display: flex; align-items: center; gap: 14px; padding: 14px 26px 14px 20px; background: var(--paper); border-radius: 28px; box-shadow: 0 6px 0 var(--shadow); pointer-events: none; transition: transform 0.4s cubic-bezier(0.3, 1.6, 0.5, 1), opacity 0.25s; width: max-content; max-width: calc(100vw - 2 * var(--gap)); box-sizing: border-box; z-index: 2; }
.toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
.toast .ic { font-size: 46px; line-height: 1; }
.toast .t { font-size: 27px; font-weight: 700; line-height: 1.1; }
.toast .s { font-size: 16px; font-weight: 500; color: var(--ink-soft); margin-top: 3px; }
#fade { position: fixed; inset: 0; background: var(--white); opacity: 0; pointer-events: none; transition: opacity 0.6s; }
#fade.on { opacity: 1; }
/* Home button: back to all games, top-left corner; the mission card sits to its right (below it on narrow phones) */
#home { position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.82);
  box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none }
#home svg { width:24px;height:24px }
#home:active { transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18) }
#showHud { position: fixed; right: var(--gap); bottom: calc(var(--gap) + env(safe-area-inset-bottom, 0px)); padding: 10px 16px; border: 0; border-radius: 20px; background: var(--paper); color: var(--ink); font-size: 16px; font-weight: 600; box-shadow: 0 5px 0 var(--shadow); cursor: pointer; }
body.hud-off #hud { display: none; }

#loading { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; background: linear-gradient(var(--bg-top), var(--bg-bottom)); z-index: 10; transition: opacity 0.8s ease; color: var(--ink); text-align: center; padding-inline: 16px; }
#loading.done { opacity: 0; pointer-events: none; }
.ld-heli { font-size: 70px; animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }
.ld-t { font-size: 42px; font-weight: 700; }
.ld-s { font-size: 18px; font-weight: 500; color: var(--ink-soft); }
.ld-bar { width: 240px; height: 14px; background: var(--paper); border-radius: 8px; overflow: hidden; }
.ld-bar i { display: block; height: 100%; width: 0; background: var(--sun); border-radius: 8px; transition: width 0.15s; }
#err { color: var(--berry); font-size: 15px; max-width: 520px; }

@media (max-width: 920px) {
  .pad { bottom: calc(var(--gap) + var(--dock-h) + 12px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 760px) {
  :root { --gap: 12px; }
  .mission { padding: 9px 12px 10px 10px; gap: 6px; }
  .m-ic { font-size: 34px; }
  .m-title { font-size: 19px; }
  .m-do { font-size: 13.5px; }
  .m-people { font-size: 18px; }
  .mapbox { width: 104px; height: 104px; border-width: 4px; }
  .pill { font-size: 14px; padding: 5px 10px; }
  .fuel-bar { width: 72px; height: 14px; }
  .fuel { font-size: 18px; }
  .cap { display: none; }
  .dock { gap: 5px; padding: 6px; border-radius: 22px; }
  .dock button { min-width: 52px; padding: 7px 4px 6px; font-size: 11px; border-radius: 15px; }
  .dock .ic { font-size: 23px; }
  .dock button.small { min-width: 44px; }
  .pad button { width: 62px; height: 62px; }
  .pad.right button { height: 52px; }
  .toast { top: 36%; }
  .toast .t { font-size: 20px; }
  .toast .ic { font-size: 34px; }
}
@media (max-width: 520px) {
  .mission { top: calc(var(--gap) + 54px + env(safe-area-inset-top, 0px)); left: var(--gap); max-width: calc(100vw - 2 * var(--gap) - 150px); }
}
@media (prefers-reduced-motion: reduce) {
  .ld-heli, .fuel.low { animation: none; }
  .toast { transition: opacity 0.2s; }
}
</style>

<canvas id="view" tabindex="0" aria-label="Rescue helicopter flight view"></canvas>

<div id="loading" role="status">
  <div class="ld-heli" aria-hidden="true">🚁</div>
  <div class="ld-t">Heli Rescue</div>
  <div class="ld-s" id="ldText">Building the world…</div>
  <div class="ld-bar"><i id="ldBar"></i></div>
  <div id="err" hidden></div>
</div>

<div id="hud">
  <div class="bubble mission">
    <div class="m-head">
      <span class="m-ic" id="mIc">🚁</span>
      <div><div class="m-title" id="mTitle">Get ready!</div><div class="m-do" id="mDo">Your first mission is coming</div></div>
    </div>
    <div class="m-people" id="mPeople"></div>
    <div class="m-bar" id="mBar" hidden><i id="mBarFill"></i></div>
  </div>

  <div class="side">
    <div class="mapbox"><canvas id="map" aria-label="Map"></canvas></div>
    <div class="bubble pill fuel" id="fuel" title="Fuel"><span aria-hidden="true">⛽</span><div class="fuel-bar"><i id="fuelFill"></i></div></div>
    <div class="bubble pill" id="score">🧑 0 saved · ⭐ 0</div>
    <div class="bubble pill cap" id="cap">🌾 Farm · ☀️ Afternoon</div>
  </div>

  <div class="pad left" aria-label="Steer">
    <button type="button" data-key="ArrowLeft" aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg></button>
    <button type="button" data-key="ArrowRight" aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="M9 4.5 16.5 12 9 19.5"/></svg></button>
  </div>
  <div class="pad right" aria-label="Fly up or down">
    <button type="button" data-key="KeyQ" aria-label="Fly up"><svg viewBox="0 0 24 24"><path d="M4.5 15 12 7.5l7.5 7.5"/></svg><span>Up</span></button>
    <button type="button" data-key="KeyE" aria-label="Fly down"><svg viewBox="0 0 24 24"><path d="M4.5 9 12 16.5 19.5 9"/></svg><span>Down</span></button>
  </div>

  <div class="dock" id="dock">
    <button type="button" id="btnBot"><span class="ic">🤖</span><span id="botLbl">Robot on</span></button>
    <button type="button" id="btnWx" style="--c: var(--sky)"><span class="ic" id="icWx">⛅</span>Weather</button>
    <button type="button" id="btnTime" class="dark-text" style="--c: var(--sun)"><span class="ic" id="icTime">☀️</span>Time</button>
    <button type="button" id="btnCam" style="--c: var(--grape)"><span class="ic">🎥</span><span id="camName">Behind</span></button>
    <button type="button" id="btnSnd" style="--c: var(--leaf)"><span class="ic" id="icSnd">🔇</span>Sound</button>
    <button type="button" id="btnHud" class="small" style="--c: var(--slate)"><span class="ic">🙈</span>Hide</button>
  </div>
  <div class="tray" id="trayWx" hidden></div>
  <div class="tray" id="trayTime" hidden></div>
  <div class="toast" id="toast" aria-live="polite"></div>
</div>
<div id="fade"></div>
<button type="button" id="showHud" hidden>👀 Show buttons</button>

   ===================================================================== */

   ===================================================================== */
const SEA = 0, FIELDS = 1, FOREST = 2, MOUNTAIN = 3, CITY = 4;

  uniforms: { tDiffuse: { value: null } },

}));

/* =====================================================================
   Shared shader code
   ===================================================================== */
const GLSL_NOISE = /* glsl */`
float hashi(ivec2 p, int s) {
  uint h = (uint(p.x) * 0x27d4eb2du) ^ (uint(p.y) * 0x165667b1u) ^ (uint(s) * 0x2545f491u);
  h = (h ^ (h >> 15u)) * 0x2c1b3c6du;
  h = (h ^ (h >> 12u)) * 0x297a2d39u;
  h = h ^ (h >> 15u);
  return float(h) * (1.0 / 4294967296.0);

float h21(vec2 p) { p = mod(p, 1024.0); vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), u.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm3(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 3; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s / 0.875; }

`;
const WU = {
  uTime: { value: 0 }, uSnow: { value: 0 }, uWet: { value: 0 }, uCloud: { value: 0.3 },
  uCloudOff: { value: new THREE.Vector2() }, uNight: { value: 0 }, uSeed: { value: SALT },
  uSkyRefl: { value: new THREE.Color(0.3, 0.45, 0.7) },
};
const WORLD_PARS = /* glsl */`
uniform float uTime; uniform float uSnow; uniform float uWet; uniform float uCloud; uniform vec2 uCloudOff;
uniform float uNight; uniform int uSeed; uniform vec3 uSkyRefl;
varying vec3 vWPos; varying vec3 vWNrm;
`;
const WORLD_VS = /* glsl */`
vec4 wP_ = vec4(transformed, 1.0);
vec3 wN_ = objectNormal;
#ifdef USE_INSTANCING
wP_ = instanceMatrix * wP_;
wN_ = mat3(instanceMatrix) * wN_;
#endif
wP_ = modelMatrix * wP_;
vWPos = wP_.xyz;
vWNrm = normalize(mat3(modelMatrix) * wN_);
`;
const SNOW_FS = /* glsl */`
{
  float up_ = smoothstep(0.5, 0.85, vWNrm.y) * step(0.4, vWPos.y);
  float sn_ = clamp(uSnow * up_ * (0.75 + 0.35 * vnoise(vWPos.xz * 0.21)), 0.0, 1.0);
  diffuseColor.rgb = mix(diffuseColor.rgb * (1.0 - uWet * 0.38), vec3(0.86, 0.89, 0.95), sn_);
}`;
const CLOUD_SHADOW_FS = /* glsl */`
{
  float cs_ = fbm3((vWPos.xz + uCloudOff) * 0.0022);
  float cut_ = mix(0.72, 0.3, uCloud);
  reflectedLight.directDiffuse *= 1.0 - smoothstep(cut_ - 0.06, cut_ + 0.06, cs_) * 0.6;
}`;

// Injects world-space varyings, weather (snow / wetness / cloud shadows) and custom hooks into a Lambert material.
function patchMaterial(mat, key, x = {}) {
  mat.onBeforeCompile = (sh) => {
    for (const k in WU) sh.uniforms[k] = WU[k];
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>\n${WORLD_PARS}\n${GLSL_NOISE}\n${x.vsPars || ''}`)
      .replace('void main() {', `void main() {\n${x.vsMain || ''}`)
      .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>\n${x.vsNormal || ''}`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>\n${x.vsBegin || ''}`)
      .replace('#include <project_vertex>', `#include <project_vertex>\n${WORLD_VS}\n${x.vsWorld || ''}`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>\n${WORLD_PARS}\n${GLSL_NOISE}\n${x.fsPars || ''}`)
      .replace('#include <color_fragment>', `#include <color_fragment>\n${x.fsColor || ''}\n${x.noSnow ? '' : SNOW_FS}`)
      .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>\n${x.fsNormal || ''}`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>\n${x.fsEmissive || ''}`)

  else if (h < 0.40) { col = vec3(0.40, 0.58, 0.20); rows = 0.30; }
  else if (h < 0.55) { col = vec3(0.42, 0.30, 0.20); rows = 0.40; }
  else if (h < 0.72) { col = vec3(0.44, 0.57, 0.26); rows = 0.00; flowers = 1.0; }
  else if (h < 0.80) { col = vec3(0.90, 0.80, 0.18); rows = 0.12; }
  else if (h < 0.95) { col = vec3(0.79, 0.72, 0.46); rows = 0.20; }

    { cw: 3.1, fh: 3.0, x0: 0.26, x1: 0.74, y0: 0.30, y1: 0.80, lit: 0.26, glass: '0.13, 0.14, 0.17', refl: 0.15, slab: 0.15 },

/* =====================================================================
   Rescue bases: one on flat ground in every farmland cell (the start cell is farmland)
   ===================================================================== */
const baseCache = new Map();
function baseForCell(c) {
  if (c.biome !== FIELDS) return null;
  const key = c.ix * 131071 + c.iz;
  if (baseCache.has(key)) return baseCache.get(key);
  let best = null;
  for (let k = 0; k < 14 && !best; k++) {
    const a = k * 2.4, r = k === 0 ? 0 : 40 + k * 14;
    const x = c.x + Math.cos(a) * r, z = c.z + Math.sin(a) * r;
    biomeAt(x, z, _W);
    if (_W[FIELDS] < 0.9) continue;
    const h = heightFromW(x, z, _W);
    if (h < 2) continue;
    let hmin = h, hmax = h;
    for (const [dx, dz] of [[-16, -16], [16, -16], [-16, 16], [16, 16], [-36, 0], [4, -32], [24, 16]]) {
      const hh = terrainHeight(x + dx, z + dz);
      hmin = Math.min(hmin, hh); hmax = Math.max(hmax, hh);
    }
    if (hmax - hmin < 3.5) best = { x, z, y: hmax + 0.3, key };
  }
  if (!best && c.ix === 0 && c.iz === 0) best = { x: c.x, z: c.z, y: Math.max(1, terrainHeight(c.x, c.z)) + 0.3, key };
  baseCache.set(key, best);
  return best;
}

  const ix = Math.floor(x / CELL), iz = Math.floor(z / CELL), out = [];
  for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) { const b = baseForCell(cellAt(ix + dx, iz + dz)); if (b) out.push(b); }
  return out;
}
function nearestBase(x, z) {
  let best = null, bd = Infinity;
  for (const r of [2, 4, 7]) {
    for (const b of basesNear(x, z, r)) { const d = Math.hypot(b.x - x, b.z - z); if (d < bd) { bd = d; best = b; } }
    if (best) return best;
  }
  return baseForCell(cellAt(0, 0));
}

const _sg = { h: 0, ny: 1, w: [0, 0, 0, 0] };
function sampleGrid(ch, lx, lz) {

  const i = Math.floor(fx), j = Math.floor(fz), tx = fx - i, tz = fz - j;

  }
  _sg.ny = ch.nrm[(Math.round(fz) * NV + Math.round(fx)) * 3 + 1];

}

function buildChunk(cx, cz) {
  const ox = cx * CHUNK, oz = cz * CHUNK;
  const hg = new Float32Array(NG * NG), bio = new Float32Array(NV * NV * 4);
  for (let j = 0; j < NG; j++) for (let i = 0; i < NG; i++) {
    const x = ox + (i - 1) * STEP, z = oz + (j - 1) * STEP;
    biomeAt(x, z, _W);
    hg[j * NG + i] = heightFromW(x, z, _W);
    if (i >= 1 && i <= NV && j >= 1 && j <= NV) {
      const k = ((j - 1) * NV + (i - 1)) * 4;
      bio[k] = _W[CITY]; bio[k + 1] = _W[FIELDS]; bio[k + 2] = _W[FOREST]; bio[k + 3] = _W[MOUNTAIN];
    }
  }
  const pos = new Float32Array(NV * NV * 3), nrm = new Float32Array(NV * NV * 3), h = new Float32Array(NV * NV);
  const obs = new Float32Array(64);
  for (let j = 0; j < NV; j++) for (let i = 0; i < NV; i++) {
    const g = (j + 1) * NG + (i + 1), k = j * NV + i, y = hg[g];
    h[k] = y;
    pos[k * 3] = i * STEP; pos[k * 3 + 1] = y; pos[k * 3 + 2] = j * STEP;
    const nx = hg[g - 1] - hg[g + 1], ny = 2 * STEP, nz = hg[g - NG] - hg[g + NG], l = Math.hypot(nx, ny, nz);
    nrm[k * 3] = nx / l; nrm[k * 3 + 1] = ny / l; nrm[k * 3 + 2] = nz / l;
    const oc = Math.min(7, Math.floor(j * STEP / 32)) * 8 + Math.min(7, Math.floor(i * STEP / 32));
    if (y > obs[oc]) obs[oc] = y;
  }
  const idx = new Uint16Array(SEG * SEG * 6);
  let t = 0;
  for (let j = 0; j < SEG; j++) for (let i = 0; i < SEG; i++) {
    const a = j * NV + i, b = a + 1, c = a + NV, d = c + 1;
    idx[t++] = a; idx[t++] = c; idx[t++] = b; idx[t++] = b; idx[t++] = c; idx[t++] = d;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geo.setAttribute('aBio', new THREE.BufferAttribute(bio, 4));

  group.add(mesh);
  scene.add(group);
  return { cx, cz, ox, oz, group, terrain: mesh, h, bio, nrm, obs, decorated: false, dyn: [], own: [], inst: [], roofs: [] };
}

const lhCache = new Map();
function lighthouseFor(c) {
  const key = c.ix * 131071 + c.iz;
  if (lhCache.has(key)) return lhCache.get(key);
  let res = null;

  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) if (dx || dz) order.push([dx, dz, hashi(c.ix + dx + OFF, c.iz + dz + OFF, SALT + 61)]);
  order.sort((a, b) => a[2] - b[2]);
  for (const [dx, dz] of order) {
    const nb = cellAt(c.ix + dx, c.iz + dz);
    if (nb.biome === SEA || nb.biome === CITY) continue;
    for (let t = 0.25; t < 0.95; t += 0.015) {

    const x = ox + lx, z = oz + lz;
    if (h < 6.5 && sea > 0.06 && w[3] < 0.4) {
      if (r < 0.09) { L.palm.push({ x: lx, y: h - 0.3, z: lz, s: 0.8 + rnd() * 0.5, ry: rnd() * TAU, ...tint(white) }); addObs(lx, lz, h + 12); }
      else if (h > 0.9 && h < 3.2 && s.ny > 0.96 && w[0] < 0.3 && r < 0.2) {
        const c = pick(FUN_COL, rnd), ry = rnd() * TAU;
        L.umb.push({ x: lx, y: h - 0.2, z: lz, s: 1, ry, r: c.r, g: c.g, b: c.b });
        const c2 = pick(FUN_COL, rnd);
        L.towel.push({ x: lx + Math.cos(ry) * 1.6, y: h, z: lz + Math.sin(ry) * 1.6, s: 1, ry, r: c2.r, g: c2.g, b: c2.b });
      }
      continue;
    }
    let p = w[2] * 0.88 + w[1] * 0.006;
    if (w[3] > 0.05) p += w[3] * (h < 140 ? 0.5 : h < 195 ? 0.16 : 0) * (s.ny < 0.75 ? 0.25 : 1);
    if (r >= p) {
      const r2 = r - p;
      if (w[3] > 0.5 && h > 45 && r2 < 0.06) L.rock.push({ x: lx, y: h - 0.4, z: lz, s: 0.6 + rnd() * 1.8, ry: rnd() * TAU, ...tint(white, 0.15) });
      else if (w[3] > 0.6 && h > 50 && h < 170 && s.ny > 0.94 && r2 < 0.065) { L.chalet.push({ x: lx, y: h - 0.4, z: lz, s: 1, ry: rnd() * TAU }); addObs(lx, lz, h + 8, 5); }
      else if (w[2] > 0.35 && r2 < 0.1) L.bush.push({ x: lx, y: h - 0.2, z: lz, s: 0.8 + rnd() * 0.6, ry: rnd() * TAU, ...tint(pick(FOL.leaf, rnd)) });
      else if (w[1] > 0.5 && r2 < 0.004) L.bush.push({ x: lx, y: h - 0.2, z: lz, s: 0.9 + rnd() * 0.5, ry: rnd() * TAU, ...tint(pick(FOL.leaf, rnd)) });
      continue;
    }
    const conif = w[3] > 0.35 || h > 110 || (w[2] > 0.5 && noise2(x * 0.0035, z * 0.0035) > 0.1);
    const sc = 0.75 + rnd() * 0.6;
    if (conif) L.con.push({ x: lx, y: h - 0.4, z: lz, s: sc, ry: rnd() * TAU, ...tint(pick(FOL.conifer, rnd)) });
    else if (rnd() < 0.18 + Math.max(0, noise2(x * 0.002 + 4, z * 0.002)) * 0.6) L.birch.push({ x: lx, y: h - 0.4, z: lz, s: sc * 0.95, ry: rnd() * TAU, ...tint(pick(FOL.birch, rnd)) });
    else {
      const aut = noise2(x * 0.0006 + 9.1, z * 0.0006 - 3.3) > 0.25 && rnd() < 0.85;
      L.leaf.push({ x: lx, y: h - 0.4, z: lz, s: sc, ry: rnd() * TAU, ...tint(pick(aut ? FOL.autumn : FOL.leaf, rnd)) });
    }
    addObs(lx, lz, h + 11 * sc);
  }

  // 2. farmland: hedgerows, hay bales, grazing herds, farmsteads, wind farms
  if (maxField > 0.5) {
    for (let n = 0; n < 700; n++) {
      let lx = rnd() * CHUNK, lz = rnd() * CHUNK;
      const s0 = sampleGrid(ch, lx, lz);
      if (s0.w[1] < 0.65 || s0.h < 1.2 || nearBase(lx, lz)) continue;
      const h0 = s0.h;
      const fi = fieldInfo(ox + lx, oz + lz);
      const ex = Math.min(fi.fx, 1 - fi.fx) * FIELD_W, ez = Math.min(fi.fz, 1 - fi.fz) * FIELD_H;
      if (fi.hedge && Math.min(ex, ez) < 4 && rnd() < 0.6) {
        let qx = fi.qx, qz = fi.qz;
        if (ex < ez) qx = (fi.ix + (fi.fx < 0.5 ? 0.9 / FIELD_W : 1 - 0.9 / FIELD_W)) * FIELD_W;
        else qz = (fi.iz + (fi.fz < 0.5 ? 0.9 / FIELD_H : 1 - 0.9 / FIELD_H)) * FIELD_H;
        lx = qx * FC - qz * FS - ox; lz = qx * FS + qz * FC - oz;
        if (lx < 0 || lz < 0 || lx > CHUNK || lz > CHUNK || nearBase(lx, lz)) continue;
        const s = sampleGrid(ch, lx, lz), sc = 0.55 + rnd() * 0.4;
        if (rnd() < 0.3) L.bush.push({ x: lx, y: s.h - 0.2, z: lz, s: 1 + rnd() * 0.4, ry: rnd() * TAU, ...tint(pick(FOL.leaf, rnd)) });
        else { L.leaf.push({ x: lx, y: s.h - 0.3, z: lz, s: sc, ry: rnd() * TAU, ...tint(pick(FOL.leaf, rnd)) }); addObs(lx, lz, s.h + 9 * sc); }
      } else if (fi.crop >= 0.80 && fi.crop < 0.95 && Math.min(ex, ez) > 4 && rnd() < 0.3) {
        L.bale.push({ x: lx, y: h0 - 0.1, z: lz, s: 1, ry: rnd() * TAU, ...tint(white, 0.08) });
      } else if (fi.crop >= 0.55 && fi.crop < 0.72 && Math.min(ex, ez) > 9 && rnd() < 0.05) {
        const cows = hashi(fi.ix + OFF, fi.iz + OFF, SALT + 24) < 0.5, n2 = 3 + Math.floor(rnd() * 5), dir = rnd() * TAU;
        for (let k = 0; k < n2; k++) {
          const ax = lx + (rnd() - 0.5) * 16, az = lz + (rnd() - 0.5) * 16;
          if (ax < 0 || az < 0 || ax > CHUNK || az > CHUNK) continue;
          const s = sampleGrid(ch, ax, az);
          (cows ? L.cow : L.sheep).push({ x: ax, y: s.h - 0.05, z: az, s: 1.15 + rnd() * 0.25, ry: dir + (rnd() - 0.5) * 1.6 });
        }
      }
    }
    if (rnd() < 0.5) {
      const lx = 40 + rnd() * 176, lz = 40 + rnd() * 176, s = sampleGrid(ch, lx, lz);
      if (s.w[1] > 0.75 && s.h > 2 && s.ny > 0.96 && !nearBase(lx, lz, 100)) {
        const yaw = -FIELD_ROT + (rnd() < 0.5 ? 0 : Math.PI / 2), h = s.h;
        const m = new THREE.Mesh(GEO.farm, propMat);
        m.position.set(lx, h - 0.5, lz); m.rotation.y = yaw;
        m.castShadow = m.receiveShadow = true;
        ch.group.add(m); addObs(lx, lz, h + 15, 24);
        const c = Math.cos(yaw), sn = Math.sin(yaw);
        for (let k = 0; k < 40; k++) {
          const side = Math.floor(k / 10), t2 = (k % 10) * 4 - 20;
          const px = side < 2 ? t2 : (side === 2 ? -22 : 22), pz = side < 2 ? (side === 0 ? -18 : 20) : t2;
          const fx = lx + px * c + pz * sn, fz = lz - px * sn + pz * c;
          if (fx < 0 || fz < 0 || fx > CHUNK || fz > CHUNK) continue;
          L.fence.push({ x: fx, y: sampleGrid(ch, fx, fz).h - 0.1, z: fz, s: 1, ry: yaw + (side < 2 ? Math.PI / 2 : 0) });
        }
      }
    }
    if (hasWindFarm(ox, oz)) {
      for (let k = 0; k < 3; k++) {
        const lx = 45 + k * 80 + rnd() * 10, lz = 50 + rnd() * 150, s = sampleGrid(ch, lx, lz);
        if (s.w[1] < 0.6 || s.h < 2 || s.ny < 0.9 || nearBase(lx, lz, 80)) continue;
        const tw = new THREE.Mesh(GEO.turbine, propMat);
        tw.position.set(lx, s.h - 0.5, lz); tw.rotation.y = TURB_YAW; tw.castShadow = true;
        const rotor = new THREE.Mesh(GEO.blades, propMat);
        rotor.position.set(0, 46.6, 2.6); rotor.rotation.z = rnd() * TAU; rotor.castShadow = true;
        tw.add(rotor); ch.group.add(tw);
        ch.dyn.push({ type: 'rotor', obj: rotor, speed: 1.0 + rnd() * 0.3 });
        addObs(lx, lz, s.h + 70, 22);
      }
    }
  }

  // 3. city
  if (maxCity > 0.6) buildCity(ch, rnd, L.leaf, addObs, tint);

  // 4. coast: wooden pier, boats, lighthouses
  if (minH < -4 && rnd() < 0.6) {
    for (let tries = 0; tries < 25; tries++) {
      const lx = 30 + rnd() * 196, lz = 30 + rnd() * 196, s = sampleGrid(ch, lx, lz);
      if (s.h < 0.8 || s.h > 2.6 || s.w[0] > 0.4) continue;
      const gx = sampleGrid(ch, lx + 4, lz).h - sampleGrid(ch, lx - 4, lz).h;
      const gz = sampleGrid(ch, lx, lz + 4).h - sampleGrid(ch, lx, lz - 4).h;
      const gl = Math.hypot(gx, gz);
      if (gl < 0.05) continue;
      const dx = -gx / gl, dz = -gz / gl;
      if (terrainHeight(ox + lx + dx * 45, oz + lz + dz * 45) > -2.5) continue;
      const yaw = Math.atan2(dx, dz);
      for (let k = 0; k < 8; k++) {
        const d = 3 + k * 6;
        L.plank.push({ x: lx + dx * d, y: 1.5, z: lz + dz * d, s: 1, ry: yaw });
        for (const sd of [-1.3, 1.3]) L.post.push({ x: lx + dx * d - dz * sd, y: 1.5, z: lz + dz * d + dx * sd, s: 1 });
      }
      break;
    }
  }
  if (minH < -6) {
    for (let n = 0; n < 3; n++) {
      const lx = 20 + rnd() * 216, lz = 20 + rnd() * 216, s = sampleGrid(ch, lx, lz);
      if (s.h > -7 || rnd() > 0.5) continue;
      const sail = rnd() < 0.55;
      const b = new THREE.Mesh(sail ? GEO.sailboat : GEO.motorboat, propMat);
      b.castShadow = true;
      b.position.set(lx, 0, lz);
      const yaw = rnd() * TAU; b.rotation.y = yaw;
      if (!sail) { const wk = new THREE.Mesh(GEO.wake, wakeMat); wk.renderOrder = 2; b.add(wk); }
      const lt = new THREE.Sprite(boatLightMat); lt.scale.setScalar(3); lt.position.set(0, sail ? 10.9 : 1.8, 0); b.add(lt);
      ch.group.add(b);
      ch.dyn.push({ type: 'boat', obj: b, yaw, target: yaw, speed: sail ? 3 + rnd() * 2 : 8 + rnd() * 5, phase: rnd() * 10, check: rnd() * 2 });
    }
  }
  const cix = Math.floor((ox + 128) / CELL), ciz = Math.floor((oz + 128) / CELL);
  for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
    const c = cellAt(cix + dx, ciz + dz);
    if (c.biome !== SEA) continue;
    const Lh = lighthouseFor(c);
    if (!Lh || Lh.x < ox || Lh.x >= ox + CHUNK || Lh.z < oz || Lh.z >= oz + CHUNK) continue;
    const g = new THREE.Group(); g.position.set(Lh.x - ox, Lh.y - 1, Lh.z - oz);
    const m = new THREE.Mesh(GEO.lighthouse, propMat); m.castShadow = m.receiveShadow = true; g.add(m);
    const beam = new THREE.Mesh(GEO.beam, lhBeamMat); beam.position.y = 27; beam.renderOrder = 6; g.add(beam);
    const glow = new THREE.Sprite(lhGlowMat); glow.position.y = 27; glow.scale.setScalar(14); g.add(glow);
    ch.group.add(g);
    ch.dyn.push({ type: 'beam', obj: beam });
    addObs(Lh.x - ox, Lh.z - oz, Lh.y + 31, 6);
  }

  // 5. rescue bases owned by this chunk
  for (const b of bases) {
    if (b.x < ox || b.x >= ox + CHUNK || b.z < oz || b.z >= oz + CHUNK) continue;
    const lx = b.x - ox, lz = b.z - oz;
    const g = new THREE.Group(); g.position.set(lx, b.y - 0.3, lz);
    const m = new THREE.Mesh(GEO.base, propMat); m.castShadow = m.receiveShadow = true; g.add(m);
    const pad = new THREE.Mesh(GEO.padTop, padMat); pad.position.y = 0.32; pad.receiveShadow = true; g.add(pad);
    const sign = new THREE.Mesh(GEO.crossSign, signMat); sign.position.set(4, 6.6, -20.8); g.add(sign);
    const sign2 = new THREE.Mesh(GEO.crossSign, signMat); sign2.position.set(4, 9.75, -27); sign2.rotation.x = -Math.PI / 2; g.add(sign2);
    const word = new THREE.Mesh(GEO.rescueWord, rescueWordMat);
    word.position.set(-29, 8.6, 11.15); g.add(word);
    ch.group.add(g);
    const pts = [];
    for (let k = 0; k < 16; k++) { const a = (k / 16) * TAU; pts.push(lx + Math.cos(a) * 14, b.y + 0.5, lz + Math.sin(a) * 14); }
    addPoints(ch, pts, padLightMat);
    addObs(lx - 29, lz, b.y + 12, 12); addObs(lx + 4, lz - 27, b.y + 11, 9);
  }

  addInstanced(ch, GEO.conifer, propMat, L.con);
  addInstanced(ch, GEO.leafy, propMat, L.leaf);
  addInstanced(ch, GEO.birch, propMat, L.birch);
  addInstanced(ch, GEO.bush, propMat, L.bush);
  addInstanced(ch, GEO.palm, propMat, L.palm);
  addInstanced(ch, GEO.rock, propMat, L.rock);
  addInstanced(ch, GEO.bale, propMat, L.bale);
  addInstanced(ch, GEO.sheep, propMat, L.sheep);
  addInstanced(ch, GEO.cow, propMat, L.cow);
  addInstanced(ch, GEO.umbrella, propMat, L.umb);
  addInstanced(ch, GEO.towel, propMat, L.towel, false);
  addInstanced(ch, GEO.plank, propMat, L.plank);
  addInstanced(ch, GEO.post, propMat, L.post);
  addInstanced(ch, GEO.chalet, propMat, L.chalet);
  addInstanced(ch, GEO.fence, propMat, L.fence, false);
}

function buildCity(ch, rnd, leaf, addObs, tint) {
  const ox = ch.ox, oz = ch.oz;
  const bl = [[], [], []], crowns = [], masts = [], warn = [], lamps = [], poles = [], acs = [], tanks = [], pads = [];
  const addBld = (lx, lz, w, d, H, type, hmin, hmax) => {
    const base = hmin - 1.5, top = hmax + H;
    bl[type].push({ x: lx, y: base, z: lz, sx: w, sy: top - base, sz: d, ...tint(pick(BLD_COL[type], rnd), 0.06) });
    let peak = top, crown = false;
    if (H > 75 && rnd() < 0.7) {
      const cH = Math.max(4, H * 0.07);
      crowns.push({ x: lx, y: top, z: lz, sx: w * 0.62, sy: cH, sz: d * 0.62, ...tint(pick(BLD_COL[1], rnd), 0.05) });
      peak += cH; crown = true;
    }
    if (H > 110) {
      if (rnd() < 0.45) pads.push({ x: lx, y: peak + 0.08, z: lz, s: Math.min(w, d) * 0.5 });
      else { masts.push({ x: lx, y: peak, z: lz, sx: 0.7, sy: 16, sz: 0.7 }); peak += 16; }
    } else if (!crown && H > 14) {
      const n = 1 + Math.floor(rnd() * 3);
      for (let k = 0; k < n; k++) acs.push({ x: lx + (rnd() - 0.5) * w * 0.55, y: top, z: lz + (rnd() - 0.5) * d * 0.55, s: 0.8 + rnd() * 0.5, ry: rnd() < 0.5 ? 0 : Math.PI / 2 });
      if (type !== 0 && rnd() < 0.4) tanks.push({ x: lx + (rnd() - 0.5) * w * 0.4, y: top, z: lz + (rnd() - 0.5) * d * 0.4, s: 0.9 + rnd() * 0.3 });
      if (H > 20 && Math.min(w, d) > 14) ch.roofs.push({ x: ox + lx, z: oz + lz, y: top, w, d });
    }
    if (H > 85) warn.push(lx, peak + 0.8, lz);
    addObs(lx, lz, peak + 5, Math.max(w, d) / 2);
  };
  for (let bz = 0; bz < 4; bz++) for (let bx = 0; bx < 4; bx++) {
    const lx0 = bx * 64, lz0 = bz * 64, cxl = lx0 + 32, czl = lz0 + 32;
    let ok = true, hmin = 1e9, hmax = -1e9;
    for (const [ax, az] of [[10, 10], [54, 10], [10, 54], [54, 54], [32, 32]]) {
      const s = sampleGrid(ch, lx0 + ax, lz0 + az);
      if (s.w[0] < 0.72 || s.h < 1.4) { ok = false; break; }
      hmin = Math.min(hmin, s.h); hmax = Math.max(hmax, s.h);
    }
    if (!ok) continue;
    const BX = ch.cx * 4 + bx, BZ = ch.cz * 4 + bz;
    if (hashi(BX + OFF, BZ + OFF, SALT + 31) < 0.1) {
      for (let k = 0; k < 16; k++) {
        const tx = lx0 + 12 + rnd() * 40, tz = lz0 + 12 + rnd() * 40, s = sampleGrid(ch, tx, tz), sc = 0.7 + rnd() * 0.4;
        leaf.push({ x: tx, y: s.h - 0.3, z: tz, s: sc, ry: rnd() * TAU, ...tint(pick(FOL.leaf, rnd)) });
        addObs(tx, tz, s.h + 9 * sc);
      }
      continue;
    }
    const t = Math.min(1, biomeAt(ox + cxl, oz + czl, _W) / 470);
    if (t < 0.38) {
      const Hm = lerp(200, 70, t / 0.38);
      if (rnd() < 0.6) addBld(cxl, czl, 26 + rnd() * 14, 26 + rnd() * 14, Hm * (0.55 + 0.45 * rnd()), rnd() < 0.6 ? 0 : 1, hmin, hmax);
      else for (const sx of [-1, 1]) addBld(cxl + sx * 11.5, czl, 19, 28 + rnd() * 10, Hm * (0.45 + 0.45 * rnd()), rnd() < 0.5 ? 0 : 1, hmin, hmax);
    } else if (t < 0.72) {
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        if (rnd() < 0.1) continue;
        const r = rnd();
        addBld(cxl + sx * 11.75, czl + sz * 11.75, 15 + rnd() * 5, 15 + rnd() * 5, 12 + rnd() * rnd() * 55 * (1.3 - t), r < 0.2 ? 0 : r < 0.65 ? 1 : 2, hmin, hmax);
      }
    } else {
      for (const sx of [-1, 0, 1]) for (const sz of [-1, 0, 1]) {
        if (rnd() < 0.2) continue;
        addBld(cxl + sx * 15.5, czl + sz * 15.5, 9 + rnd() * 3, 9 + rnd() * 3, 6 + rnd() * 8, 2, hmin, hmax);
      }
    }
  }
  bl.forEach((list, type) => addInstanced(ch, GEO.box, bldMats[type], list));
  addInstanced(ch, GEO.box, crownMat, crowns);
  addInstanced(ch, GEO.box, plainMat, masts);
  addInstanced(ch, GEO.ac, propMat, acs);
  addInstanced(ch, GEO.tank, propMat, tanks);
  addInstanced(ch, GEO.padTop, padMat, pads.map((p) => ({ ...p, s: p.s / 26 })), false);

  // traffic, lamp posts and street trees along road lines owned by this chunk
  const A = [], B = [], C = [], S = [];
  for (let axis = 0; axis < 2; axis++) for (let r = 0; r < 4; r++) {
    const line = r * 64;
    let ok = true, hs = 0;
    for (let k = 0; k < 4; k++) {
      const along = 32 + k * 64, s = axis === 0 ? sampleGrid(ch, line + 1, along) : sampleGrid(ch, along, line + 1);
      if (s.w[0] < 0.75 || s.h < 1.3) ok = false;
      hs += s.h;
    }
    for (let m = 0; m < 8; m++) {
      const along = 16 + m * 32;
      for (const side of [-7.5, 7.5]) {
        const px = axis === 0 ? line + side : along, pz = axis === 0 ? along : line + side;
        const s = sampleGrid(ch, px, pz);
        if (s.w[0] < 0.62 || s.h < 1.2) continue;
        const dx = axis === 0 ? -Math.sign(side) : 0, dz = axis === 0 ? 0 : -Math.sign(side);
        poles.push({ x: px, y: s.h - 0.2, z: pz, s: 1, ry: Math.atan2(dx, dz) });
        lamps.push(px + dx * 1.45, s.h + 6.8, pz + dz * 1.45);
      }
    }
    for (let m = 0; m < 4; m++) for (const off of [24, 40]) for (const side of [-7.7, 7.7]) {
      const along = m * 64 + off, px = axis === 0 ? line + side : along, pz = axis === 0 ? along : line + side;
      const s = sampleGrid(ch, px, pz);
      if (s.w[0] > 0.7 && s.h > 1.2 && rnd() < 0.8) leaf.push({ x: px, y: s.h - 0.2, z: pz, s: 0.42 + rnd() * 0.12, ry: rnd() * TAU, ...tint(pick(FOL.leaf, rnd)) });
    }
    if (!ok) continue;
    const n = 3 + Math.floor(rnd() * 5), y = hs / 4 - 0.1;
    for (let k = 0; k < n; k++) {
      const bus = rnd() < 0.12;
      A.push(axis, line, 0, CHUNK);
      B.push(rnd() < 0.5 ? 1 : -1, bus ? 8 + rnd() * 3 : 9 + rnd() * 7, rnd() * CHUNK, y);
      const c = pick(bus ? BUS_COL : CAR_COL, rnd); C.push(c.r, c.g, c.b);
      S.push(bus ? 2.5 : 1, bus ? 1.35 : 1);
    }
  }
  addInstanced(ch, GEO.pole, propMat, poles, false);
  if (A.length) {
    const g = new THREE.InstancedBufferGeometry().copy(GEO.car);
    g.setAttribute('aCarA', new THREE.InstancedBufferAttribute(new Float32Array(A), 4));
    g.setAttribute('aCarB', new THREE.InstancedBufferAttribute(new Float32Array(B), 4));
    g.setAttribute('aCarC', new THREE.InstancedBufferAttribute(new Float32Array(C), 3));
    g.setAttribute('aCarS', new THREE.InstancedBufferAttribute(new Float32Array(S), 2));
    g.instanceCount = A.length / 4;
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(128, 10, 128), 200);
    const cars = new THREE.Mesh(g, carMat);
    cars.receiveShadow = true;
    ch.group.add(cars); ch.own.push(g);
  }
  addPoints(ch, lamps, lampMat);
  addPoints(ch, warn, warnMat);
}

const world = {
  chunks: new Map(),
  update(budgetMs) {
    const t0 = performance.now();
    const fx = Math.sin(pilot.heading), fz = Math.cos(pilot.heading);
    const ccx = (pilot.pos.x + fx * 200) / CHUNK, ccz = (pilot.pos.z + fz * 200) / CHUNK;
    const need = [], deco = [], R = Math.ceil(LOAD_R) + 1;
    for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) {
      const cx = Math.floor(ccx) + dx, cz = Math.floor(ccz) + dz;
      const d = Math.hypot(cx + 0.5 - ccx, cz + 0.5 - ccz);
      if (d > LOAD_R) continue;

const WX = {
  clear:    { cloud: 0.10, overcast: 0.00, fog: 0.00, rain: 0, snow: 0, wind: 0.20, storm: 0 },
  partly:   { cloud: 0.45, overcast: 0.12, fog: 0.05, rain: 0, snow: 0, wind: 0.35, storm: 0 },
  overcast: { cloud: 0.85, overcast: 0.62, fog: 0.15, rain: 0, snow: 0, wind: 0.45, storm: 0 },
  fog:      { cloud: 0.60, overcast: 0.45, fog: 1.00, rain: 0, snow: 0, wind: 0.06, storm: 0 },
  rain:     { cloud: 0.92, overcast: 0.75, fog: 0.30, rain: 0.75, snow: 0, wind: 0.55, storm: 0 },
  storm:    { cloud: 1.00, overcast: 0.95, fog: 0.35, rain: 1.00, snow: 0, wind: 1.00, storm: 1 },
  snow:     { cloud: 0.90, overcast: 0.60, fog: 0.22, rain: 0, snow: 1.00, wind: 0.40, storm: 0 },
};
const WX_KID = { clear: ['☀️', 'Sunny'], partly: ['⛅', 'Some clouds'], overcast: ['☁️', 'Cloudy'], fog: ['🌫️', 'Foggy'], rain: ['🌧️', 'Rainy'], storm: ['⛈️', 'Stormy'], snow: ['❄️', 'Snowy'] };
const WX_SAY = { clear: 'Sunny skies!', partly: 'A few fluffy clouds', overcast: 'Clouds rolling in', fog: 'Foggy! Lights on', rain: 'Here comes the rain!', storm: 'Thunderstorm! Hold on!', snow: "It's snowing!" };
const WX_WEIGHT = { clear: 3, partly: 3, overcast: 1.6, fog: 1.1, rain: 1.6, storm: 1.1, snow: 1.1 };
const WX_PARAMS = ['cloud', 'overcast', 'fog', 'rain', 'snow', 'wind', 'storm'];
const wx = { mode: 'auto', key: 'partly', timer: 70, cur: { ...WX.partly }, windAng: 0.6, windSpd: 6, rainEff: 0, snowEff: 0, nextStrike: 3, flashT: 99, flash: 0 };
function pickWx(prev) {
  const keys = Object.keys(WX).filter((k) => k !== prev);
  let tot = 0; for (const k of keys) tot += WX_WEIGHT[k];
  let r = Math.random() * tot;
  for (const k of keys) { r -= WX_WEIGHT[k]; if (r <= 0) return k; }
  return keys[0];
}
const tod = { h: 11.0, rate: 1 };   // 1x = a full day in 10 minutes

const SK = {
  dayZen: new THREE.Color('#2f6fc4'), dayHor: new THREE.Color('#a9c9e6'),
  setZen: new THREE.Color('#3b4f86'), setHor: new THREE.Color('#f0a060'),
  nightZen: new THREE.Color('#03060e'), nightHor: new THREE.Color('#0d1828'),
  ovDayZen: new THREE.Color('#7d8792'), ovDayHor: new THREE.Color('#a4acb4'), ovNight: new THREE.Color('#0a0c10'),
  fogDay: new THREE.Color('#b9c1c8'),
  sunLow: new THREE.Color('#ff9a52'), sunHigh: new THREE.Color('#fff2dc'), moon: new THREE.Color('#9db4e0'),
  ground: new THREE.Color('#5a5440'),

const env = { zen: new THREE.Color(), hor: new THREE.Color(), sunCol: new THREE.Color(), night: 0, dayF: 1, light: 1, sunDir: new THREE.Vector3(), moonDir: new THREE.Vector3(), lightDir: new THREE.Vector3() };
const _ca = new THREE.Color(), _cb = new THREE.Color();

function strike() {
  wx.flashT = 0;
  const fx = Math.sin(pilot.heading), fz = Math.cos(pilot.heading);
  const ahead = 250 + Math.random() * 650, lat = (Math.random() - 0.5) * 900;
  const x = pilot.pos.x + fx * ahead - fz * lat, z = pilot.pos.z + fz * ahead + fx * lat;
  if (bolt) { scene.remove(bolt); bolt.geometry.dispose(); }
  bolt = makeBolt(x, z, 520, Math.max(0, terrainHeight(x, z)));
  scene.add(bolt);
  if (audio.ctx && audio.ctx.state === 'running') audio.thunder(Math.hypot(x - camera.position.x, z - camera.position.z) / 340, clamp(1.2 - ahead / 1200, 0.3, 1));
}

function updateWeather(dt) {
  if (wx.mode === 'auto') {
    wx.timer -= dt;
    if (wx.timer <= 0) { wx.key = pickWx(wx.key); wx.timer = 50 + Math.random() * 50; }
  } else wx.key = wx.mode;
  const T = WX[wx.key], k = damp(0.14, dt);
  for (const p of WX_PARAMS) wx.cur[p] += (T[p] - wx.cur[p]) * k;
  const alpine = smooth(170, 260, pilot.pos.y);
  wx.rainEff = wx.cur.rain * (1 - alpine);
  wx.snowEff = clamp(wx.cur.snow + wx.cur.rain * alpine, 0, 1);
  WU.uSnow.value = clamp(WU.uSnow.value + (wx.snowEff > 0.3 ? 0.035 : -0.012) * dt, 0, 1);
  WU.uWet.value += (wx.rainEff - WU.uWet.value) * damp(0.08, dt);
  WU.uCloud.value = wx.cur.cloud;
  wx.windAng += noise2(simTime * 0.01, 4.4) * dt * 0.02;
  wx.windSpd = 3 + wx.cur.wind * 17;
  WU.uCloudOff.value.x += Math.sin(wx.windAng) * wx.windSpd * dt * 1.5;
  WU.uCloudOff.value.y += Math.cos(wx.windAng) * wx.windSpd * dt * 1.5;
  if (wx.cur.storm > 0.6) {
    wx.nextStrike -= dt;
    if (wx.nextStrike <= 0) { strike(); wx.nextStrike = 3 + Math.random() * 8; }
  }
  wx.flashT += dt;
  const t = wx.flashT;
  wx.flash = t < 0.06 ? 1 : t < 0.12 ? 0.25 : t < 0.2 ? 0.85 : Math.exp(-(t - 0.2) * 12);
  if (REDUCED) wx.flash *= 0.3;
  if (bolt) bolt.visible = t < 0.32;
}

function updateEnvironment(dt) {
  tod.h = (tod.h + dt * 0.04 * tod.rate) % 24;
  const th = ((tod.h - 6) / 24) * TAU;
  // +X is west and +Z is north (see compass()), so the sun rises at -X and peaks in the south (-Z).
  env.sunDir.set(-Math.cos(th), Math.sin(th) * 0.9, -Math.sin(th) * 0.38 + 0.12).normalize();
  env.moonDir.set(Math.cos(th) * 0.8, -Math.sin(th) * 0.85 + 0.12, -0.35).normalize();
  const e = env.sunDir.y, ov = wx.cur.overcast, fog = wx.cur.fog, fl = wx.flash * wx.cur.storm;
  const dayF = smooth(-0.1, 0.22, e), tw = 1 - smooth(0.0, 0.32, Math.abs(e - 0.02));
  env.dayF = dayF;
  env.night = 1 - smooth(-0.06, 0.1, e);
  const { zen, hor } = env;
  zen.copy(SK.nightZen).lerp(SK.dayZen, dayF);
  hor.copy(SK.nightHor).lerp(SK.dayHor, dayF);
  hor.lerp(SK.setHor, tw * 0.8 * (1 - ov * 0.85));
  zen.lerp(SK.setZen, tw * 0.45 * (1 - ov * 0.85));
  _ca.copy(SK.ovNight).lerp(SK.ovDayHor, dayF); hor.lerp(_ca, ov * 0.85);
  _ca.copy(SK.ovNight).lerp(SK.ovDayZen, dayF); zen.lerp(_ca, ov * 0.85);
  _ca.copy(SK.ovNight).lerp(SK.fogDay, dayF); hor.lerp(_ca, fog * 0.65); zen.lerp(_ca, fog * 0.35);
  const gloom = 1 - wx.cur.storm * 0.55 - wx.rainEff * 0.12;
  hor.multiplyScalar(gloom); zen.multiplyScalar(gloom * 0.9);
  scene.fog.color.copy(hor).addScalar(fl * 0.25);
  scene.fog.density = 0.0009 + fog * 0.0066 + wx.rainEff * 0.0016 + wx.snowEff * 0.0014 + ov * 0.0003;

  env.sunCol.copy(SK.sunLow).lerp(SK.sunHigh, smooth(0.0, 0.4, e));
  const sunUp = e > -0.04;
  env.lightDir.copy(sunUp ? env.sunDir : env.moonDir);
  sun.intensity = sunUp ? 3.3 * smooth(-0.04, 0.12, e) * (1 - 0.82 * ov) * (1 - 0.3 * fog) : 0.6 * smooth(-0.04, -0.16, e) * (1 - 0.75 * ov);
  sun.color.copy(sunUp ? env.sunCol : SK.moon);
  _ca.copy(zen).lerp(hor, 0.5);
  const mx = Math.max(_ca.r, _ca.g, _ca.b, 1e-4);
  hemi.color.copy(_ca).multiplyScalar(1 / mx);
  hemi.groundColor.copy(SK.ground).lerp(_ca.multiplyScalar(1 / mx), 0.3);
  hemi.intensity = lerp(0.32, 1.35, dayF) * (1 - ov * 0.25) * (1 - wx.cur.storm * 0.35) + fl * 3.5;
  env.light = clamp(hemi.intensity / 1.35 + sun.intensity * 0.12, 0.1, 1.2);

  env.night = Math.max(env.night, ov * 0.42);
  WU.uNight.value = env.night;
  WU.uSkyRefl.value.copy(zen).lerp(hor, 0.4);
  renderer.toneMappingExposure = lerp(1.05, 1.45, 1 - dayF);
  bloom.strength = 0.38 + (1 - dayF) * 0.14;

  const su = skyMat.uniforms;
  su.uSunDir.value.copy(env.sunDir); su.uMoonDir.value.copy(env.moonDir);
  su.uZen.value.copy(zen).addScalar(fl * 0.2); su.uHor.value.copy(hor).addScalar(fl * 0.25);
  su.uSunCol.value.copy(env.sunCol); su.uDay.value = dayF; su.uCloud.value = wx.cur.cloud; su.uOvercast.value = ov;
  su.uStars.value = (1 - smooth(-0.15, 0.02, e)) * (1 - fog); su.uFlash.value = fl * 0.6; su.uSunVis.value = smooth(-0.05, 0.05, e);
  su.uTime.value = simTime;

  const wu = waterMat.uniforms;
  wu.uSunDir.value.copy(env.lightDir); wu.uSunCol.value.copy(sun.color).multiplyScalar(sun.intensity / 3.3);
  wu.uZen.value.copy(zen); wu.uHor.value.copy(hor);
  wu.uAmb.value.copy(hemi.color).multiplyScalar(hemi.intensity * 0.3);
  wu.uWave.value = 0.35 + wx.cur.wind * 0.95; wu.uTime.value = simTime;

  const cu = clouds.mat.uniforms;

  _ca.copy(hor).multiplyScalar(1.15).add(_cb.copy(env.sunCol).multiplyScalar(0.35 * smooth(-0.02, 0.2, e) * (1 - ov)));

  rain.shift.x += wvx * dt; rain.shift.y -= 42 * dt; rain.shift.z += wvz * dt;
  rain.shift.x %= 150; rain.shift.y %= 100; rain.shift.z %= 150;
  const ru = rain.mat.uniforms;
  ru.uShift.value.copy(rain.shift); ru.uCenter.value.copy(camera.position);
  ru.uStreak.value.set((wvx - pilot.vel.x) * 0.045, -42 * 0.045 - pilot.vs * 0.045, (wvz - pilot.vel.z) * 0.045);
  ru.uOpacity.value = clamp(wx.rainEff * 1.4, 0, 0.5);
  ru.uColor.value.setRGB(0.55, 0.6, 0.68).multiplyScalar(lerp(0.3, 0.9, dayF) + fl * 2);
  rain.geo.setDrawRange(0, Math.floor(RAIN_N * clamp(wx.rainEff * 1.2, 0, 1)) * 2);
  rain.mesh.visible = wx.rainEff > 0.01;
  snow.shift.x += wvx * 0.6 * dt; snow.shift.y -= 2.4 * dt; snow.shift.z += wvz * 0.6 * dt;
  snow.shift.x %= 160; snow.shift.y %= 110; snow.shift.z %= 160;
  const nu = snow.mat.uniforms;
  nu.uShift.value.copy(snow.shift); nu.uCenter.value.copy(camera.position); nu.uTime.value = simTime % 1000;
  nu.uOpacity.value = clamp(wx.snowEff * 1.3, 0, 0.95);
  nu.uColor.value.setRGB(0.9, 0.92, 0.96).multiplyScalar(lerp(0.25, 1.0, dayF) + fl);
  snow.geo.setDrawRange(0, Math.floor(SNOW_N * clamp(wx.snowEff, 0, 1)));
  snow.mesh.visible = wx.snowEff > 0.01;

  const N = env.night;
  lampMat.opacity = smooth(0.25, 0.7, N); lampMat.visible = lampMat.opacity > 0.01;
  const blink = (simTime % 1.5) < 0.75 ? 1 : 0.08;
  warnMat.opacity = smooth(0.2, 0.6, N) * blink; warnMat.visible = warnMat.opacity > 0.01;
  padLightMat.opacity = 0.35 + smooth(0.2, 0.6, N) * 0.65;
  boatLightMat.opacity = smooth(0.2, 0.6, N);
  lhGlowMat.opacity = smooth(0.2, 0.6, N);
  lhBeamMat.uniforms.uOpacity.value = smooth(0.2, 0.6, N) * (0.35 + fog * 0.4 + wx.rainEff * 0.3);

  sun.position.copy(pilot.pos).addScaledVector(env.lightDir, 500);
  sun.target.position.copy(pilot.pos);
  sun.target.updateMatrixWorld();
  sky.position.copy(camera.position);
  water.position.set(camera.position.x, 0, camera.position.z);
  WU.uTime.value = simTime;
}

/* =====================================================================
   Rescue game: missions, winch, fuel, bases
   ===================================================================== */
const MISSION_TYPES = [
  { id: 'ship', biome: SEA, ic: '🚢', title: 'A ship is sinking!', n: [3, 4] },
  { id: 'swimmer', biome: SEA, ic: '🏊', title: 'A swimmer needs help!', n: [1, 1] },
  { id: 'hikers', biome: MOUNTAIN, ic: '🧗', title: 'Hikers stuck on the mountain!', n: [2, 3] },
  { id: 'skier', biome: MOUNTAIN, ic: '⛷️', title: 'A skier is hurt in the snow!', n: [1, 1] },
  { id: 'campers', biome: FOREST, ic: '🏕️', title: 'Campers lost in the forest!', n: [2, 3] },
  { id: 'roof', biome: CITY, ic: '🏢', title: 'People stuck on a rooftop!', n: [2, 4] },
  { id: 'farmer', biome: FIELDS, ic: '🚜', title: 'A farmer needs a doctor!', n: [1, 1] },
];
const FUEL_BURN = 0.5;            // percent per second: a full tank lasts a bit over three minutes
const SKID = 1.75;                // heli origin height above the ground when landed
const HOLD = new Set(['start', 'winch', 'land', 'unload', 'refill', 'takeoff', 'fade']);
const PHASE_COL = { go: 0xff7a1a, deliver: 0x2fb35a, refuel: 0xffc61a };
const game = { fuel: 100, saved: 0, stars: 0, mission: null, phase: 'start', base: null, timer: 3, aboard: 0, robot: true, recent: [], after: 'go', winch: null, walkers: [] };

const personGeo = {
  legs: Box(0.5, 0.9, 0.3).translate(0, 0.45, 0), torso: Box(0.62, 0.75, 0.36).translate(0, 1.27, 0),
  head: Sph(0.22, 10, 8).translate(0, 1.9, 0), cap: Sph(0.24, 10, 6, 0, TAU, 0, Math.PI / 2).translate(0, 1.95, 0),
  arm: Box(0.16, 0.72, 0.16).translate(0, -0.32, 0),

const matCache = new Map();
const lam = (hex) => { if (!matCache.has(hex)) matCache.set(hex, new THREE.MeshLambertMaterial({ color: hex })); return matCache.get(hex); };
const CLOTHES = [0xff4f84, 0xffb21f, 0x2f9cf0, 0x34b85c, 0x8a63ff, 0xff7043, 0x00bcd4, 0xffe14a];
function makePerson(seed) {
  const g = new THREE.Group(), r = mulberry32(seed);
  const shirt = lam(CLOTHES[Math.floor(r() * CLOTHES.length)]);
  g.add(new THREE.Mesh(personGeo.legs, lam(0x2b3a67)), new THREE.Mesh(personGeo.torso, shirt), new THREE.Mesh(personGeo.head, lam(0xf0c09a)));
  g.add(new THREE.Mesh(personGeo.cap, lam(CLOTHES[Math.floor(r() * CLOTHES.length)])));
  const arms = [-1, 1].map((s) => { const a = new THREE.Mesh(personGeo.arm, shirt); a.position.set(s * 0.4, 1.6, 0); g.add(a); return a; });
  g.userData = { arms, ph: r() * 10 };
  g.children.forEach((m) => { m.castShadow = true; });
  g.scale.setScalar(1.9);

}

// Light column + pulsing ring + floating badge that marks a rescue site or base.
function makeMarker(color, ic) {
  const g = new THREE.Group();
  const colMat = makeBeamMat(color, { invert: true, power: 1.4, edgePow: 1.2, bands: true, gain: 1.6, opacity: 0.8 });
  const col = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 260, 24, 1, true).translate(0, 130, 0), colMat);
  col.renderOrder = 9; g.add(col);
  const ring = new THREE.Mesh(new THREE.RingGeometry(26, 30, 56).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.75, depthWrite: false, side: THREE.DoubleSide }));
  ring.position.y = 1.2; ring.renderOrder = 9; g.add(ring);
  const badge = new THREE.Sprite(new THREE.SpriteMaterial({ map: emojiTex(ic, '#' + new THREE.Color(color).getHexString()), depthTest: false, transparent: true }));
  badge.renderOrder = 20; g.add(badge);

}
function disposeMarker(mk) {

  mk.col.geometry.dispose(); mk.colMat.dispose(); mk.ring.geometry.dispose(); mk.ring.material.dispose(); mk.badge.material.dispose();
}
function updateMarker(mk, x, y, z, t) {
  if (!mk) return;
  mk.g.position.set(x, y, z);
  const s = 1 + Math.sin(t * 3) * 0.08;
  mk.ring.scale.set(s, 1, s);
  const d = camera.position.distanceTo(mk.g.position);
  mk.badge.position.y = 34 + Math.sin(t * 2) * 2;
  mk.badge.scale.setScalar(clamp(d * 0.05, 12, 70));
  mk.colMat.uniforms.uOpacity.value = 0.45 + 0.35 * smooth(80, 400, d);

const arrow = (() => {
  const sh = new THREE.Shape();
  sh.moveTo(0, 2.2); sh.lineTo(1.7, 0.2); sh.lineTo(0.6, 0.2); sh.lineTo(0.6, -1.8); sh.lineTo(-0.6, -1.8); sh.lineTo(-0.6, 0.2); sh.lineTo(-1.7, 0.2); sh.closePath();
  const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.35, bevelEnabled: false }).rotateX(Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.92 });
  const m = new THREE.Mesh(geo, mat);
  m.renderOrder = 10; m.visible = false;
  scene.add(m);
  return { m, mat };
})();

function slopeAt(x, z) {
  const e = 4, hx = terrainHeight(x + e, z) - terrainHeight(x - e, z), hz = terrainHeight(x, z + e) - terrainHeight(x, z - e);
  return Math.hypot(hx, hz) / (2 * e);
}
function findSite(type) {
  const p = pilot.pos;
  if (type.id === 'roof') {
    const roofs = [];
    for (const ch of world.chunks.values()) for (const r of ch.roofs) { const d = Math.hypot(r.x - p.x, r.z - p.z); if (d > 450 && d < 1100) roofs.push(r); }
    return roofs.length ? { ...roofs[Math.floor(Math.random() * roofs.length)] } : null;
  }
  for (let k = 0; k < 160; k++) {
    const a = pilot.heading + (Math.random() - 0.5) * 3.6, d = 800 + Math.random() * 1500;
    const x = p.x + Math.sin(a) * d, z = p.z + Math.cos(a) * d;
    biomeAt(x, z, _W);
    if (_W[type.biome] < 0.85) continue;
    const h = heightFromW(x, z, _W);
    if (type.id === 'ship' && h < -12) return { x, z, y: 0 };
    if (type.id === 'swimmer' && h < -3 && h > -10) return { x, z, y: 0 };
    if (type.id === 'hikers' && h > 110 && h < 260 && slopeAt(x, z) < 0.35) return { x, z, y: h };
    if (type.id === 'skier' && h > 190 && slopeAt(x, z) < 0.45) return { x, z, y: h };
    if (type.id === 'campers' && h > 5 && slopeAt(x, z) < 0.25) return { x, z, y: h };
    if (type.id === 'farmer' && h > 2 && slopeAt(x, z) < 0.12 && !hasWindFarm(Math.floor(x / CHUNK) * CHUNK, Math.floor(z / CHUNK) * CHUNK)) return { x, z, y: h };
  }
  return null;
}

function buildSite(type, site, n) {
  const g = new THREE.Group(); g.position.set(site.x, site.y, site.z);
  const yaw = Math.random() * TAU; g.rotation.y = yaw;
  const people = [], emit = [];
  const put = (geo, x, y, z, ry = 0, rz = 0) => { const m = new THREE.Mesh(geo, propMat); m.position.set(x, y, z); m.rotation.set(0, ry, rz); m.castShadow = m.receiveShadow = true; g.add(m); return m; };
  const ground = (lx, lz) => {
    if (type.id === 'roof' || site.y === 0) return 0;
    const c = Math.cos(yaw), s = Math.sin(yaw);
    return terrainHeight(site.x + lx * c + lz * s, site.z - lx * s + lz * c) - site.y;
  };
  let spots = [];
  const smokeAt = (lx, ly, lz, color, rate, size) => {
    const c = Math.cos(yaw), s = Math.sin(yaw);
    emit.push({ x: site.x + lx * c + lz * s, y: site.y + ly, z: site.z - lx * s + lz * c, rate, life: 6, rise: 5, size, alpha: 0.8, color: new THREE.Color(color) });
  };
  if (type.id === 'ship') {
    g.userData.ship = put(GEO.ship, 0, 0, 0, 0, 0.1);
    put(GEO.raft, 13, 0, 4);
    spots = [[12.6, 0.3, 3.4], [13.6, 0.3, 4.6], [12.8, 0.3, 5.0], [13.4, 0.3, 3.2]];
    smokeAt(0, 13, -16, 0x3a3a3a, 3, 7);
  } else if (type.id === 'swimmer') {
    put(GEO.buoy, 0, 0, 0);
    spots = [[0, -1.6, 0]];
    smokeAt(2, 0.5, 0, 0xff5533, 2.5, 3);
  } else if (type.id === 'hikers' || type.id === 'campers') {
    put(GEO.tent, -4, ground(-4, -2), -2, 0.4);
    if (type.id === 'campers') { put(GEO.logs, 3, ground(3, 2), 2); smokeAt(3, ground(3, 2) + 1, 2, 0x8a8a8a, 2.5, 4); }
    else smokeAt(4, ground(4, -3) + 0.5, -3, 0xff7a1a, 3.5, 4);
    spots = [[0, 0, 2], [1.6, 0, 0.6], [-1.4, 0, 3]].map(([x, , z]) => [x, ground(x, z), z]);
  } else if (type.id === 'skier') {
    put(GEO.skis, 0, ground(0, 1.5), 1.5);
    spots = [[0, ground(0, 0), 0]];
    smokeAt(3, ground(3, 0) + 0.5, 0, 0xff3b30, 3, 4);
  } else if (type.id === 'roof') {
    spots = [[0, 0.1, 0], [2, 0.1, 1], [-2, 0.1, 1.2], [1, 0.1, -2]];
    smokeAt(site.w * 0.35, 0.5, -site.d * 0.3, 0x707070, 3, 6);
  } else if (type.id === 'farmer') {
    put(GEO.tractor, -5, ground(-5, 2), 2, 0.3, 0.5);
    spots = [[0, ground(0, 0), 0]];
    smokeAt(-5, ground(-5, 2) + 2.5, 2, 0x5a5a5a, 2.5, 4);
  }
  for (let i = 0; i < n; i++) {
    const p = makePerson((Math.random() * 1e9) | 0);
    const [x, y, z] = spots[i % spots.length];
    p.position.set(x, y, z); p.rotation.y = Math.random() * TAU;
    p.userData.home = p.position.clone();
    g.add(p); people.push(p);
  }
  scene.add(g);
  return { g, people, emitters: emit.map((e) => smoke.add(e)) };
}

function startMission(type, site) {
  const n = type.n[0] + Math.floor(Math.random() * (type.n[1] - type.n[0] + 1));
  const built = buildSite(type, site, n);
  // Centre the rescue ring (and the hover point) on the people, e.g. the life raft beside a ship.
  built.g.updateMatrixWorld(true);
  let cx = 0, cz = 0;
  for (const p of built.people) { p.getWorldPosition(_pp); cx += _pp.x; cz += _pp.z; }
  game.mission = { type, ...site, x: cx / n, z: cz / n, n, ...built, homeBase: nearestBase(cx / n, cz / n), marker: makeMarker(PHASE_COL.go, '🆘'), t: 0 };
  game.recent.push(type.id); if (game.recent.length > 4) game.recent.shift();
  toast(type.ic, type.title, 'Follow the orange arrow 🆘');
}
function newMission() {
  const order = MISSION_TYPES.slice().sort(() => Math.random() - 0.5).sort((a, b) => game.recent.indexOf(a.id) - game.recent.indexOf(b.id));
  for (const type of order) { const site = findSite(type); if (site) { startMission(type, site); return true; } }
  return false;
}
function endMission() {
  const m = game.mission;
  if (!m) return;
  scene.remove(m.g);
  m.emitters.forEach((e) => smoke.remove(e));
  disposeMarker(m.marker);
  game.mission = null;
}
function setBaseMarker(color) {
  if (game.baseMarker) disposeMarker(game.baseMarker);
  game.baseMarker = color ? makeMarker(color, color === PHASE_COL.refuel ? '⛽' : '🏥') : null;
}
function objective() {
  const m = game.mission;
  if (game.phase === 'go' && m) return { x: m.x, y: m.y, z: m.z };
  if ((game.phase === 'deliver' || game.phase === 'refuel') && game.base) return { x: game.base.x, y: game.base.y, z: game.base.z };
  return null;
}
function goToBase(phase) {
  game.phase = phase;
  game.base = nearestBase(pilot.pos.x, pilot.pos.z);
  setBaseMarker(PHASE_COL[phase]);
}
function outOfFuel() {
  game.phase = 'fade'; game.timer = 0;
  toast('😮', 'Out of fuel!', 'The tow team brings you back to base');
  document.getElementById('fade').classList.add('on');
}

const _wp = new THREE.Vector3(), _pp = new THREE.Vector3(), _up = new THREE.Vector3(0, -1, 0);
function updateRope(from, to) {
  const d = _pp.subVectors(to, from), len = d.length();
  heli.rope.visible = len > 0.2;
  heli.rope.position.copy(from);
  heli.rope.quaternion.setFromUnitVectors(_up, d.normalize());
  heli.rope.scale.set(1, Math.max(len, 0.01), 1);
}

function updateGame(dt) {
  const P = pilot, m = game.mission, ph = game.phase;
  game.timer += dt;
  if (m) {
    m.t += dt;
    updateMarker(m.marker, m.x, m.y, m.z, simTime);
    m.marker.g.visible = ph === 'go';
    for (const p of m.people) {
      if (!p.visible || p.userData.lifting) continue;
      const a = p.userData.arms, w = Math.sin(simTime * 7 + p.userData.ph) * 0.5;
      a[0].rotation.z = -2.5 - w; a[1].rotation.z = 2.5 - w;
      p.rotation.y += dt * 0.3;
    }
    if (m.g.userData.ship) {
      const s = m.g.userData.ship, k = Math.min(1, m.t / 120);
      s.rotation.z = 0.1 + k * 0.25 + Math.sin(simTime * 0.8) * 0.02;
      s.position.y = -k * 2.5 + Math.sin(simTime * 1.1) * 0.2;
    }
  }
  if (game.base && game.baseMarker) updateMarker(game.baseMarker, game.base.x, game.base.y, game.base.z, simTime);

  if (!HOLD.has(ph)) {
    game.fuel = Math.max(0, game.fuel - FUEL_BURN * dt);
    if (game.fuel <= 0) { outOfFuel(); return; }
    if (ph === 'go' && m) {
      const dSite = Math.hypot(m.x - P.pos.x, m.z - P.pos.z);
      const b = m.homeBase;
      // Only divert when a full tank would cover the trip; if even that isn't enough, refuelling can't help, so press on.
      const need = ((dSite + (b ? Math.hypot(b.x - m.x, b.z - m.z) : 1500)) / 40) * FUEL_BURN + 10;
      if (game.fuel < 25 || (game.robot && P.manual <= 0 && game.fuel < need && need <= 100)) {
        goToBase('refuel');
        toast('⛽', 'Low fuel!', 'Fly to the rescue base to fill up');
        return;
      }
      if (dSite < 32 && P.pos.y - Math.max(m.y, obstacleAt(m.x, m.z) - 8) < 80 && P.speed < 24) {
        game.phase = 'winch'; game.winch = { i: 0, stage: 'lower', t: 0 };
        toast('🪢', 'Hold steady!', 'Lifting everyone up');
      }
    }
    if ((ph === 'deliver' || ph === 'refuel') && game.base) {
      const dB = Math.hypot(game.base.x - P.pos.x, game.base.z - P.pos.z);
      if (dB < 34 && P.pos.y - game.base.y < 85 && P.speed < 26) { game.phase = 'land'; game.timer = 0; }
    }
  }

  if (ph === 'start' && game.timer > 2.5) {
    if (newMission()) { game.phase = 'takeoff'; game.after = 'go'; game.timer = 0; }
    else game.timer = 1.5;
  } else if (ph === 'takeoff' && game.timer > 3) {
    game.phase = game.after; setBaseMarker(null);
  } else if (ph === 'winch' && m) {
    const W = game.winch, p = m.people[W.i];
    heli.winchPoint.getWorldPosition(_wp);
    W.t += dt;
    if (W.stage === 'lower') {
      const hand = p.getWorldPosition(new THREE.Vector3());
      hand.y += 2.6;
      updateRope(_wp, hand.clone().lerp(_wp, 1 - Math.min(1, W.t / 1.0)));
      if (W.t >= 1.0) { W.stage = 'lift'; W.t = 0; W.from = hand; p.userData.lifting = true; }
    } else {
      const k = Math.min(1, W.t / 2.0), pos = W.from.clone().lerp(_wp, k * k * (3 - 2 * k));
      m.g.worldToLocal(_pp.copy(pos).setY(pos.y - 2.6));
      p.position.copy(_pp);
      p.userData.arms[0].rotation.z = -2.9; p.userData.arms[1].rotation.z = 2.9;
      updateRope(_wp, pos);
      if (k >= 1) {
        p.visible = false; game.aboard++; W.i++; W.stage = 'lower'; W.t = 0;
        if (W.i >= m.n) {
          heli.rope.visible = false;
          m.emitters.forEach((e) => smoke.remove(e));
          goToBase('deliver');
          toast('👍', 'Everyone is on board!', 'Fly them to the hospital 🏥');
        }
      }
    }
  } else if (ph === 'land' && Math.abs(P.pos.y - (game.base.y + SKID)) < 0.35 && game.timer > 1.5) {
    game.timer = 0;
    setBaseMarker(null);
    if (game.aboard > 0) {
      game.phase = 'unload';
      const b = game.base;
      for (let i = 0; i < game.aboard; i++) {
        const p = makePerson((Math.random() * 1e9) | 0);
        p.position.set(P.pos.x - 3 + Math.random() * 2, b.y, P.pos.z + (Math.random() - 0.5) * 3);
        scene.add(p);
        game.walkers.push({ p, delay: i * 0.5, to: new THREE.Vector3(b.x + 4, b.y, b.z - 20.5) });
      }
    } else game.phase = 'refill';
  } else if (ph === 'unload') {
    for (const w of game.walkers) {
      w.delay -= dt;
      if (w.delay > 0) continue;
      const d = _pp.subVectors(w.to, w.p.position).setY(0), L = d.length();
      if (L < 0.8) { w.p.visible = false; continue; }
      w.p.position.addScaledVector(d.normalize(), Math.min(L, dt * 4.5));
      w.p.rotation.y = Math.atan2(d.x, d.z);
      const sw = Math.sin(simTime * 10 + w.delay) * 0.6;
      w.p.userData.arms[0].rotation.x = sw; w.p.userData.arms[1].rotation.x = -sw;
    }
    if (game.walkers.every((w) => !w.p.visible) || game.timer > 9) {
      game.walkers.forEach((w) => scene.remove(w.p));
      game.walkers = [];
      game.saved += game.aboard; game.stars++;
      toast('⭐', 'Rescue complete!', `${game.aboard} ${game.aboard === 1 ? 'person' : 'people'} saved · filling up the tank`);
      game.aboard = 0;
      endMission();
      game.phase = 'refill'; game.timer = 0;
    }
  } else if (ph === 'refill') {
    game.fuel = Math.min(100, game.fuel + 35 * dt);
    if (game.fuel >= 100 && game.timer > 2) {
      game.timer = 0;
      if (game.mission) { game.phase = 'takeoff'; game.after = 'go'; }
      else game.phase = 'start';
    }
  } else if (ph === 'fade') {
    if (game.timer > 0.9 && !game.moved) {
      game.moved = true;
      const b = nearestBase(P.pos.x, P.pos.z);
      P.pos.set(b.x, b.y + SKID, b.z); P.speed = 0; P.vs = 0;
      game.base = b; heli.rope.visible = false; setBaseMarker(null);
      if (m) {
        m.people.forEach((p) => { p.visible = true; p.userData.lifting = false; p.position.copy(p.userData.home); });
        if (!m.emitters.some((e) => smoke.emitters.has(e))) m.emitters.forEach((e) => smoke.emitters.add(e));
      }
      game.aboard = 0;
      cam.yawS = P.heading;
      for (let i = 0; i < 8; i++) world.update(60);
    }
    if (game.timer > 1.6) {
      document.getElementById('fade').classList.remove('on');
      game.moved = false; game.phase = 'refill'; game.timer = 0;
    }

/* =====================================================================
   Flight: responsive steering, autopilot towards the current objective
   ===================================================================== */
const pilot = {
  pos: new THREE.Vector3(), vel: new THREE.Vector3(), heading: 0, speed: 0, vs: 0, turnRate: 0, pitch: 0, roll: 0, accel: 0,
  manual: 0, manualSpeed: 40, altOffset: 0, ground: 0, here: FIELDS, hereH: 0, lightOn: false,

const keys = new Set();
function initPilot() {
  const b = baseForCell(cellAt(0, 0));
  game.base = b;
  pilot.pos.set(b.x, b.y + SKID, b.z);
  pilot.heading = Math.random() * TAU;
}
function updatePilot(dt) {
  const P = pilot, p = P.pos;
  const kL = keys.has('ArrowLeft') || keys.has('KeyA'), kR = keys.has('ArrowRight') || keys.has('KeyD');
  const kU = keys.has('ArrowUp') || keys.has('KeyW'), kD = keys.has('ArrowDown') || keys.has('KeyS');
  const kQ = keys.has('KeyQ') || keys.has('PageUp'), kE = keys.has('KeyE') || keys.has('PageDown');
  if (kL || kR || kU || kD || kQ || kE) P.manual = 3;
  P.manual = Math.max(0, P.manual - dt);
  biomeAt(p.x, p.z, _W);
  P.here = dominant(_W); P.hereH = heightFromW(p.x, p.z, _W);
  const prevSpeed = P.speed;

  if (HOLD.has(game.phase)) {
    // The game flies these moments: hovering over people, landing, taking off, parked on the pad.
    const b = game.base, m = game.mission;
    let tx = p.x, tz = p.z, ty = p.y;
    if (game.phase === 'winch' && m) { tx = m.x; tz = m.z; ty = Math.max(m.y + 22, obstacleAt(m.x, m.z) + 14); }
    else if (b && (game.phase === 'land' || game.phase === 'unload' || game.phase === 'refill' || game.phase === 'start')) {
      tx = b.x; tz = b.z;
      const hd = Math.hypot(b.x - p.x, b.z - p.z);
      ty = game.phase === 'land' && hd > 3 ? Math.max(b.y + 12, p.y - 5) : b.y + SKID;
    } else if (game.phase === 'takeoff' && b) { tx = b.x; tz = b.z; ty = b.y + 34; }
    const k = damp(game.phase === 'takeoff' ? 1.2 : 1.6, dt);
    const nx = lerp(p.x, tx, k), nz = lerp(p.z, tz, k);
    const inv = dt > 0 ? 1 / dt : 0;
    P.vel.set((nx - p.x) * inv, 0, (nz - p.z) * inv);

    const vy = clamp((ty - p.y) * 1.2, -7, 9);
    P.vs += (vy - P.vs) * damp(3, dt);
    p.y += P.vs * dt;
    if (game.phase !== 'takeoff' && game.phase !== 'winch' && b) p.y = Math.max(p.y, b.y + SKID);
    P.vel.y = P.vs;
    P.speed = Math.hypot(P.vel.x, P.vel.z);
    if (game.phase === 'takeoff' && m) P.heading += wrapAngle(Math.atan2(m.x - p.x, m.z - p.z) - P.heading) * damp(1.2, dt);
    P.turnRate = 0;
    P.manualSpeed = 40;
  } else {
    const o = objective();
    const d = o ? Math.hypot(o.x - p.x, o.z - p.z) : 1e9;
    let targetRate, targetSpeed;
    if (P.manual > 0 || !game.robot) {
      targetRate = ((kL ? 1 : 0) - (kR ? 1 : 0)) * 0.95;
      P.manualSpeed = clamp(P.manualSpeed + ((kU ? 1 : 0) - (kD ? 1 : 0)) * 30 * dt, 12, 80);
      targetSpeed = P.manualSpeed;
      P.altOffset = clamp(P.altOffset + ((kQ ? 1 : 0) - (kE ? 1 : 0)) * 45 * dt, -62, 300);
    } else {
      const desired = o ? Math.atan2(o.x - p.x, o.z - p.z) : P.heading;
      const maxRate = d < 90 ? 0.7 : 0.42;
      targetRate = clamp(wrapAngle(desired - P.heading) * (d < 90 ? 1.6 : 0.9), -maxRate, maxRate);
      targetSpeed = (_W[CITY] > 0.5 ? 34 : 42) * (1 - wx.cur.storm * 0.15);
      P.manualSpeed = Math.max(P.speed, 30);
      P.altOffset *= Math.exp(-dt * 0.06);
    }
    if (d < 450) targetSpeed = Math.min(targetSpeed, lerp(5, 42, clamp((d - 30) / 420, 0, 1)));
    P.turnRate += (targetRate - P.turnRate) * damp(P.manual > 0 ? 7 : 3.5, dt);
    P.heading = wrapAngle(P.heading + P.turnRate * dt);
    P.speed += (targetSpeed - P.speed) * damp(1.4, dt);

    const fx = Math.sin(P.heading), fz = Math.cos(P.heading), rx = -fz, rz = fx;
    const gHere = obstacleAt(p.x, p.z);
    const clear = d < 350 ? 18 : P.manual > 0 || !game.robot ? 24 : 42;
    let obs = gHere + 12;
    const look = Math.min(clamp(P.speed * 11, 60, 600), Math.max(d - 25, 30));
    for (let k = 1; k <= 12; k++) {
      const a = (k / 12) * look;
      for (let l = -1; l <= 1; l++) obs = Math.max(obs, obstacleAt(p.x + fx * a + rx * l * 24, p.z + fz * a + rz * l * 24) + clear);
    }
    // Cruise height, or a glide down towards the target, but never below what clears the obstacles ahead.
    const want = d < 350 ? Math.max(gHere + 14, o.y + 18, o.y + 28 + (d / 350) * 50 + P.altOffset * 0.3) : gHere + CRUISE + P.altOffset;
    const need = Math.max(want, obs);
    P.ground = gHere;
    const vsT = clamp((need - p.y) * 1.1, -16, 24);
    P.vs += (vsT - P.vs) * damp(3.5, dt);
    p.y = Math.max(p.y + P.vs * dt, gHere + 12);
    P.vel.set(fx * P.speed, P.vs, fz * P.speed);
    p.x += P.vel.x * dt; p.z += P.vel.z * dt;
  }
  P.accel = lerp(P.accel, (P.speed - prevSpeed) / Math.max(dt, 1e-3), damp(3, dt));
  const turb = (wx.cur.wind * 0.02 + wx.cur.storm * 0.035) * (REDUCED ? 0.3 : 1) * (HOLD.has(game.phase) ? 0.4 : 1);
  const tp = 0.02 + (P.speed / 45) * 0.1 + P.accel * 0.04 - P.vs * 0.005 + noise2(simTime * 1.7, 11) * turb;
  const tr = clamp(-P.turnRate * 0.8, -0.62, 0.62) + noise2(simTime * 1.3, 29) * turb * 1.5;
  P.pitch += (tp - P.pitch) * damp(6, dt);
  P.roll += (tr - P.roll) * damp(6, dt);
}

const SPOT_I = 5;

   Camera
   ===================================================================== */
const CAM_MODES = ['Chase', 'High', 'Side', 'Orbit', 'Cinematic'];
const CAM_NAMES = ['Behind', 'Up high', 'Side', 'Spin', 'Movie'];
const cam = { mode: 0, zoom: 1, yawS: 0, orbitYaw: 0, orbitPitch: 0, lastDrag: -10, sub: 'Chase', subT: 0, fly: null };
const _cp = new THREE.Vector3(), _lk = new THREE.Vector3();
function updateCamera(dt) {
  const p = heli.root.position;
  let mode = CAM_MODES[cam.mode];
  if (mode === 'Cinematic') {
    cam.subT -= dt;
    if (cam.subT <= 0) {
      const opts = ['Chase', 'High', 'Side', 'Orbit', 'Flyby'].filter((m) => m !== cam.sub);
      cam.sub = opts[Math.floor(Math.random() * opts.length)]; cam.subT = 10 + Math.random() * 8; cam.fly = null;
    }
    mode = cam.sub;
  }
  cam.yawS += wrapAngle(pilot.heading - cam.yawS) * damp(3.2, dt);
  if (simTime - cam.lastDrag > 2.5) { cam.orbitYaw *= Math.exp(-dt * 1.1); cam.orbitPitch *= Math.exp(-dt * 1.1); }
  const fx = Math.sin(cam.yawS), fz = Math.cos(cam.yawS);

  const Z = cam.zoom * (camera.aspect < 1 ? 1.55 : 1);
  // Show off the big moments: the winch from the side, people walking into the hospital.
  if (game.phase === 'winch' && game.mission) mode = 'Winch';
  else if (game.phase === 'unload' && game.base) mode = 'Unload';
  if (mode === 'Winch') {
    const m = game.mission;
    sph(cam.yawS + 1.9 + cam.orbitYaw, clamp(0.18 + cam.orbitPitch, 0, 1.2), 40 * Z);
    _lk.set(lerp(m.x, p.x, 0.55), lerp(m.y, p.y, 0.55) + 1, lerp(m.z, p.z, 0.55));
  } else if (mode === 'Unload') {
    const b = game.base;
    _cp.set(b.x + 30 * Z, b.y + 16 * Z, b.z + 26 * Z);
    _lk.set(b.x + 2, b.y + 2, b.z - 10);
  } else if (mode === 'Chase') {
    sph(cam.yawS + cam.orbitYaw, clamp(0.4 + cam.orbitPitch, 0.05, 1.4), 30 * Z);
    _lk.set(p.x + fx * 12, p.y - 1.5, p.z + fz * 12);
  } else if (mode === 'High') {
    sph(cam.yawS + cam.orbitYaw, clamp(0.62 + cam.orbitPitch, 0.05, 1.45), 72 * Z);
    _lk.set(p.x + fx * 30, p.y - 4, p.z + fz * 30);
  } else if (mode === 'Side') {
    sph(cam.yawS + 1.75 + cam.orbitYaw, clamp(0.12 + cam.orbitPitch, -0.3, 1.4), 24 * Z);
    _lk.set(p.x + fx * 4, p.y, p.z + fz * 4);
  } else if (mode === 'Orbit') {
    sph(simTime * 0.22 + cam.orbitYaw, clamp(0.3 + cam.orbitPitch, -0.2, 1.4), 34 * Z);
    _lk.copy(p);
  } else {
    const fhx = Math.sin(pilot.heading), fhz = Math.cos(pilot.heading);
    if (!cam.fly || (p.x - cam.fly.x) * fhx + (p.z - cam.fly.z) * fhz > 140 || p.distanceTo(cam.fly) > 600) {
      const side = Math.random() < 0.5 ? -1 : 1, ahead = 160 + Math.random() * 100;
      const x = p.x + fhx * ahead - fhz * side * (35 + Math.random() * 40), z = p.z + fhz * ahead + fhx * side * (35 + Math.random() * 40);
      cam.fly = new THREE.Vector3(x, Math.max(p.y - 15 + Math.random() * 30, obstacleAt(x, z) + 8), z);
    }
    _cp.copy(cam.fly); _lk.copy(p);
  }
  const floor = obstacleAt(_cp.x, _cp.z) + 6;
  if (_cp.y < floor) _cp.y = floor;
  if (!REDUCED && mode !== 'Flyby') {
    const sh = wx.cur.wind * 0.12 + wx.cur.storm * 0.25 + wx.flash * wx.cur.storm * 0.2;
    _cp.x += noise2(simTime * 3.1, 1) * sh; _cp.y += noise2(simTime * 2.7, 2) * sh;
  }
  camera.position.copy(_cp);
  camera.lookAt(_lk);
}

const audio = {
  ctx: null, nodes: null,
  start() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = () => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; };
    const master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    const rf = ctx.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 260;
    const rg = ctx.createGain(); rg.gain.value = 0.42;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 6.3;
    const lg = ctx.createGain(); lg.gain.value = 0.36; lfo.connect(lg); lg.connect(rg.gain); lfo.start();
    noise().connect(rf); rf.connect(rg); rg.connect(master);
    const rainF = ctx.createBiquadFilter(); rainF.type = 'highpass'; rainF.frequency.value = 1100;
    const rainG = ctx.createGain(); rainG.gain.value = 0; noise().connect(rainF); rainF.connect(rainG); rainG.connect(master);
    const windF = ctx.createBiquadFilter(); windF.type = 'bandpass'; windF.frequency.value = 340; windF.Q.value = 0.6;
    const windG = ctx.createGain(); windG.gain.value = 0; noise().connect(windF); windF.connect(windG); windG.connect(master);
    this.ctx = ctx; this.nodes = { master, rainG, windG, buf };
  },
  update() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, n = this.nodes;
    n.rainG.gain.setTargetAtTime(wx.rainEff * 0.22, t, 0.5);
    n.windG.gain.setTargetAtTime(wx.cur.wind * 0.12 + wx.snowEff * 0.03, t, 0.5);
  },
  thunder(delay, power) {
    const ctx = this.ctx, t0 = ctx.currentTime + delay;
    const s = ctx.createBufferSource(); s.buffer = this.nodes.buf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(power * 1.4, t0 + 0.08);
    g.gain.exponentialRampToValueAtTime(power * 0.5, t0 + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.0);
    s.connect(f); f.connect(g); g.connect(this.nodes.master); s.start(t0); s.stop(t0 + 4.2);
  },
  chime(notes = [523, 659, 784]) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const ctx = this.ctx;
    notes.forEach((hz, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + i * 0.12;
      o.type = 'triangle'; o.frequency.value = hz;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      o.connect(g); g.connect(this.nodes.master); o.start(t0); o.stop(t0 + 0.55);
    });
  },
};

const toastQ = [];
